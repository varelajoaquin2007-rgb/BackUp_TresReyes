async function loadViajesRep() {
  const rid = state.user.repartidor_id;
  if (!rid) {
    document.getElementById('rep-viajes-list').innerHTML='<div class="card"><p class="text-muted">Tu usuario no tiene perfil de repartidor. Contactá al administrador.</p></div>';
    return;
  }
  const r = await api(`viajes.php?repartidor_id=${rid}`);
  if (!r.success) return;
  state.viajesRep = r.viajes;

  // RF09: si hay un viaje en curso (p.ej. tras recargar la página),
  // retomar el envío de ubicación automáticamente.
  const enCurso = state.viajesRep.find(v => v.estado === 'en_curso');
  if (enCurso) iniciarSeguimientoUbicacion(enCurso);
  else detenerSeguimientoUbicacion();

  const el = document.getElementById('rep-viajes-list');
  if (!el) return;

  // Viaje en curso / listo para salir, separado del historial ya finalizado.
  const activos     = state.viajesRep.filter(v => v.estado === 'confirmado' || v.estado === 'en_curso');
  const finalizados = state.viajesRep.filter(v => v.estado === 'finalizado');

  if (!activos.length && !finalizados.length) { el.innerHTML='<div class="card"><p class="text-muted">No tenés viajes asignados.</p></div>'; return; }

  const estadoColor={confirmado:'var(--amarillo)',en_curso:'var(--azul)',finalizado:'var(--verde)'};
  const tarjetaViaje = (v, i) => `
  <div class="viaje-rep-card">
    <div class="viaje-rep-header">
      <div><div style="font-weight:700">🚛 ${v.patente||'Camión'} · ${v.zona?('Zona '+v.zona):''}</div>
      <div class="text-sm text-muted">${cantParadas(v.boletas)} paradas · ${(v.boletas||[]).length} boletas · ${v.peso_total} kg</div></div>
      <span class="tag" style="background:${estadoColor[v.estado]||'#333'};color:#fff">${v.estado==='confirmado'?'Listo para salir':v.estado==='en_curso'?'En curso':v.estado==='finalizado'?'Finalizado':'—'}</span>
    </div>
    ${agruparParadasTracking(v.boletas).map((g,j)=>{
      // Una fila por PARADA (misma dirección): lista todas sus boletas y se
      // marcan juntas con un solo casillero.
      const hecha = g.hecha;
      const pendientesIds = g.boletas.filter(b=>b.estado!=='entregada').map(b=>b.id).join(',');
      const primera = g.boletas[0];
      const horas = g.boletas.map(b=>b.entregada_at).filter(Boolean).sort();
      const pesoTotal = g.boletas.reduce((s,b)=>s+(parseFloat(b.peso_kg)||0),0);
      const hayPeso = g.boletas.some(b=>b.peso_kg!=null&&b.peso_kg!=='');
      return `
    <div class="parada-rep ${hecha?'entregada':''}" id="parada-${primera.id}">
      <button class="check-btn ${hecha?'done':''}" data-bids="${pendientesIds}" ${v.estado!=='en_curso'&&!hecha?'data-bloqueado="1" style="opacity:.4"':''}>${hecha?'✓':''}</button>
      <div class="parada-info">
        ${g.boletas.map((b,k)=>`<div class="parada-cliente">${k===0?(j+1)+'. ':''}${escapeHtmlTracking(b.cliente)} ${nroBoleta(b)}${g.boletas.length>1&&b.peso_kg!=null&&b.peso_kg!==''?` <span class="text-muted" style="font-weight:400;font-size:.85em">· ${b.peso_kg} kg</span>`:''}</div>`).join('')}
        <div class="parada-dir">${escapeHtmlTracking(primera.direccion)} ${!(primera.lat&&primera.lon)?'<span class="tag tag-amarillo" style="font-size:11px">⚠️ Sin ubicación — no aparece en el mapa</span>':''}</div>
        <div class="parada-peso">${hayPeso?(g.boletas.length>1?'Total '+(+pesoTotal.toFixed(2))+' kg':primera.peso_kg+' kg'):''} ${hecha&&horas.length?`<span class="text-muted hora-entrega">· ✓ ${formatTime(horas[horas.length-1])}</span>`:''}</div>
      </div>
    </div>`;
    }).join('')}
    <div style="padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap">
      ${v.estado==='confirmado'?`<button class="btn btn-primary" data-init="${v.id}">▶ Iniciar viaje</button>`:''}
      ${v.estado==='en_curso'?`
        <button class="btn btn-primary btn-sm" data-gmaps="${v.id}">🗺️ Abrir ruta en Google Maps</button>
        <button class="btn btn-danger btn-sm" data-fin="${v.id}">✓ Finalizar</button>`:''}
    </div>
  </div>`;

  el.innerHTML = `
    <h2 style="font-size:16px;margin-bottom:10px">🚛 Viaje en curso</h2>
    ${activos.length ? activos.map(tarjetaViaje).join('') : '<div class="card mb-4"><p class="text-muted">No tenés ningún viaje activo ahora mismo.</p></div>'}
    <h2 style="font-size:16px;margin:20px 0 10px">🗂️ Historial de viajes</h2>
    ${finalizados.length ? `<div style="display:grid;gap:10px">${finalizados.map(v => `
      <div class="card">
        <div style="font-weight:700">🚛 ${v.patente||'Camión'} · ${v.zona?('Zona '+v.zona):''}</div>
        <div class="text-sm text-muted mt-2">
          ${cantParadas(v.boletas)} paradas · ${(v.boletas||[]).length} boletas · ${v.peso_total} kg
          ${v.started_at?` · ▶ ${formatTime(v.started_at)}`:''}
          ${v.finished_at?` · ✓ ${formatTime(v.finished_at)}`:''}
        </div>
      </div>`).join('')}</div>` : '<div class="card"><p class="text-muted">Todavía no finalizaste ningún viaje (se muestran los de las últimas 48 hs).</p></div>'}
  `;
  document.querySelectorAll('.check-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if (btn.dataset.bloqueado) { toast('Primero tocá "▶ Iniciar viaje" para poder marcar entregas', 'error'); return; }
      if (btn.classList.contains('done') || btn.dataset.enviando) return;
      const ids = String(btn.dataset.bids || '').split(',').filter(Boolean).map(x => parseInt(x));
      if (!ids.length) return;
      btn.dataset.enviando = '1';
      let fallo = null;
      for (const bid of ids) {
        const rr = await api('viajes.php','POST',{action:'entregar_parada',boleta_id:bid});
        if (!rr.success) { fallo = rr.message || 'No se pudo marcar la entrega'; break; }
        // Reflejarlo en el estado local: así "Abrir ruta en Google Maps" ya
        // no incluye esta parada sin necesidad de recargar la lista.
        (state.viajesRep||[]).forEach(vj => (vj.boletas||[]).forEach(bo => {
          if (bo.id == bid) { bo.estado = 'entregada'; bo.entregada_at = new Date().toISOString(); }
        }));
      }
      delete btn.dataset.enviando;
      if (fallo) { toast(fallo, 'error'); return; }
      btn.classList.add('done');btn.textContent='✓';btn.closest('.parada-rep').classList.add('entregada');
      // Mostrar la hora de entrega al toque, sin recargar
      const pesoEl = btn.closest('.parada-rep').querySelector('.parada-peso');
      if (pesoEl && !pesoEl.querySelector('.hora-entrega')) {
        const ahora = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
        pesoEl.insertAdjacentHTML('beforeend', ` <span class="text-muted hora-entrega">· ✓ ${ahora}</span>`);
      }
    });
  });
  document.querySelectorAll('[data-init]').forEach(btn=>btn.addEventListener('click',()=>iniciarViaje(parseInt(btn.dataset.init))));
  document.querySelectorAll('[data-gmaps]').forEach(btn=>btn.addEventListener('click',()=>{const v=state.viajesRep.find(x=>x.id===parseInt(btn.dataset.gmaps));if(v)abrirGoogleMaps(v);}));
  document.querySelectorAll('[data-fin]').forEach(btn=>btn.addEventListener('click',()=>finalizarViaje(parseInt(btn.dataset.fin))));
}

async function abrirGoogleMaps(viaje, ventanaPrevia) {
  const todas = viaje.boletas || [];
  // Solo las que faltan entregar van a Maps — si ya se entregó una
  // parada (por ejemplo, al reabrir la ruta a mitad de camino, o
  // después de sumar una parada nueva a un viaje en curso), no tiene
  // sentido volver a pasar por ahí.
  const paradas = todas.filter(b => b.lat && b.lon && b.estado !== 'entregada');
  const sinUbicar = todas.filter(b => !(b.lat && b.lon) && b.estado !== 'entregada');
  if (!paradas.length) {
    if (ventanaPrevia) ventanaPrevia.close();
    toast('Sin coordenadas para navegar', 'error');
    return;
  }

  // Pestaña de Maps: si no nos pasaron una ya abierta (ver iniciarViaje),
  // la abrimos ACÁ, como lo primero que hace la función, antes de
  // cualquier espera (el GPS es asíncrono) — así queda ligada al toque
  // del usuario y Safari no la bloquea. Queda en blanco hasta el final,
  // cuando ya sabemos la URL real. Así tu página no se reemplaza: queda
  // en su propia pestaña, y para volver alcanza con cambiar de pestaña
  // en vez de tocar "atrás" adentro de Maps.
  const ventana = ventanaPrevia !== undefined ? ventanaPrevia : window.open('', '_blank');

  // Avisar si hay paradas sin geolocalizar: quedan afuera del mapa, pero
  // igual hay que entregarlas — el repartidor las ve en la lista de abajo.
  if (sinUbicar.length) {
    toast(`⚠️ ${sinUbicar.length} parada${sinUbicar.length>1?'s':''} sin ubicación no ${sinUbicar.length>1?'aparecen':'aparece'} en el mapa: ${sinUbicar.map(b=>b.cliente).join(', ')}. Están igual en la lista de abajo.`, 'error');
  }

  // Formato oficial de Google Maps Directions (api=1). Las coordenadas se
  // normalizan a 6 decimales y sin espacios (más decimales rompen el
  // parámetro waypoints y Google devuelve "No se encuentra ese lugar").
  const fmt = (lat, lon) => `${parseFloat(lat).toFixed(6)},${parseFloat(lon).toFixed(6)}`;

  // Origen: la ubicación REAL del repartidor en este momento (se pide
  // justo acá, rápido). Es el único origen con el que Google Maps deja
  // tocar "Iniciar" y navegar de verdad — con un origen fijo (la
  // fábrica) se puede VER la ruta pero no arrancarla, porque no estás
  // parado ahí. Si el GPS falla, se usa la fábrica como respaldo (al
  // menos deja ver la ruta, aunque no se pueda iniciar desde ese punto).
  // OJO: esto NO afecta el orden de las paradas, que ya se calculó al
  // confirmar el viaje usando la fábrica — acá solo se usa para el
  // origen del link.
  const pos = await new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
      err => {
        console.warn('[TR] No se pudo obtener ubicación para el link:', err.code, err.message);
        resolve(null);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
  });

  const origen = pos ? fmt(pos.lat, pos.lon) : fmt(FABRICA.lat, FABRICA.lon);

  // Destino: el punto de finalización que eligió el admin para este
  // viaje, si eligió uno. Si no, el destino es la ÚLTIMA entrega de la
  // ruta ya optimizada (no hay ningún punto por defecto) — el resto de
  // las paradas van como waypoints intermedios.
  let destinoParadas, intermediasParadas;
  if (viaje.destino_lat && viaje.destino_lon) {
    destinoParadas = fmt(viaje.destino_lat, viaje.destino_lon);
    intermediasParadas = paradas;
  } else {
    const ultima = paradas[paradas.length - 1];
    destinoParadas = fmt(ultima.lat, ultima.lon);
    intermediasParadas = paradas.slice(0, -1);
  }
  const destino = destinoParadas;

  // Sacar duplicados CONSECUTIVOS (dos o más paradas seguidas con la
  // misma coordenada exacta, ej. varias boletas de la misma dirección —
  // puede pasar con 2, 3 o más facturas repetidas). Google Maps no logra
  // calcular un tramo de distancia cero entre paradas idénticas seguidas,
  // y en vez de mostrar la ruta se queda en la pantalla de búsqueda sin
  // vista previa. Para el LINK se unifican en un solo punto (es la misma
  // parada física); en la lista de entregas de la app el repartidor las
  // sigue viendo separadas igual, cada una con su propio check.
  const paradasSinDupConsecutivos = [];
  let prevKey = null;
  for (const p of intermediasParadas) {
    const key = fmt(p.lat, p.lon);
    if (key !== prevKey) paradasSinDupConsecutivos.push(p);
    prevKey = key;
  }
  const intermedias = paradasSinDupConsecutivos.map(p => fmt(p.lat, p.lon)).join('|');

  let urlWeb = `https://www.google.com/maps/dir/?api=1`
    + `&origin=${encodeURIComponent(origen)}`
    + `&destination=${encodeURIComponent(destino)}`
    + `&travelmode=driving`;
  if (intermedias) urlWeb += `&waypoints=${encodeURIComponent(intermedias)}`;

  console.log('[TR Maps] URL generada:', urlWeb);

  // Llevar a la pestaña ya abierta a la ruta real. Si por algún motivo
  // no se pudo abrir esa pestaña (bloqueada igual, o poco frecuente),
  // como respaldo navegamos la pestaña actual para no dejarte sin nada.
  if (ventana) ventana.location.href = urlWeb;
  else window.location.href = urlWeb;
}

async function iniciarViaje(viaje_id) {
  const v=state.viajesRep.find(x=>x.id===viaje_id);
  if(!v)return;

  // Abrir la pestaña de Maps YA, en el mismo instante del toque —antes
  // de llamar al servidor y de pedir el GPS, que son cosas asíncronas—
  // para que quede ligada al toque del usuario y Safari no la bloquee
  // después. Se completa (le decimos a dónde ir) recién al final, en
  // abrirGoogleMaps. Así queda en SU PROPIA pestaña: para volver a
  // marcar una entrega alcanza con cambiar de pestaña, no hay que tocar
  // "atrás" adentro de Maps.
  const ventanaMaps = window.open('', '_blank');

  const payload = { action:'iniciar', viaje_id, repartidor_id:state.user.repartidor_id, camion_id:v.camion_id||state.user.camion_id };

  const r=await api('viajes.php','POST',payload);
  if(r.success){
    toast('▶ Viaje iniciado');
    await loadViajesRep();
    const updated = state.viajesRep.find(x=>x.id===viaje_id);
    if(updated) {
      // Empezar a mandar ubicación al servidor apenas arranca el viaje
      // (para el tracking en vivo del admin).
      iniciarSeguimientoUbicacion(updated);
      // Si el servidor devolvió las boletas ya reordenadas, usamos ese
      // orden para el link.
      if (r.boletas && r.boletas.length) updated.boletas = r.boletas;
      // Completar la pestaña ya abierta con la ruta real.
      abrirGoogleMaps(updated, ventanaMaps);
    } else if (ventanaMaps) {
      ventanaMaps.close();
    }
  } else {
    if (ventanaMaps) ventanaMaps.close();
    toast(r.message,'error');
  }
}

async function finalizarViaje(viaje_id) {
  if(!confirm('¿Confirmás que terminaste el viaje?'))return;
  const r=await api('viajes.php','POST',{action:'finalizar',viaje_id});
  if(r.success){toast('✅ Viaje finalizado.');detenerSeguimientoUbicacion();cerrarNavegacion();await loadViajesRep();}
  else toast(r.message,'error');
}

      <div id="nav-instruction-text">
        <div id="nav-distance-next">Calculando...</div>
        <div id="nav-turn-text">Obteniendo ruta</div>
        <div id="nav-street-name"></div>
      </div>
      <button onclick="cerrarNavegacion()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div id="nav-subbar">
      <span id="nav-progress">Parada 1/1</span>
      <span id="nav-gps-status">📡 Buscando GPS...</span>
      <span id="nav-eta"></span>
    </div>
    <div id="nav-map"></div>
    <div id="nav-footer">
      <div id="nav-stop-info">
        <div id="nav-stop-name">Cargando...</div>
        <div id="nav-stop-addr"></div>
        <div id="nav-stop-meta"></div>
      </div>
      <div id="nav-btns">
        <button class="btn btn-secondary btn-sm" id="nav-prev" style="flex:1">← Anterior</button>
        <button class="btn btn-primary" id="nav-next" style="flex:2">Siguiente →</button>
        <button class="btn btn-danger btn-sm" id="nav-fin">✓ Finalizar</button>
      </div>
    </div>
  </div>`;
}

function abrirNavegacion(viaje){navViaje=viaje;navParadaActual=0;state.repPage='nav';render();setTimeout(()=>initNavMap(),300);}

function cerrarNavegacion(){
  detenerGPS();state.repPage='viajes';
  if(navMapObj){try{navMapObj.remove();}catch(e){}navMapObj=null;}
  render();bindRepartidor();
}

function initNavMap(){
  const todas=(navViaje?.boletas||[]);
  const paradas=todas.filter(b=>b.lat&&b.lon);
  const sinUbicar=todas.filter(b=>!(b.lat&&b.lon)&&b.estado!=='entregada');
  if(!paradas.length){cerrarNavegacion();return;}
  if(sinUbicar.length){
    toast(`⚠️ ${sinUbicar.length} parada${sinUbicar.length>1?'s':''} sin ubicación no ${sinUbicar.length>1?'aparecen':'aparece'} en el mapa: ${sinUbicar.map(b=>b.cliente).join(', ')}. Están igual en la lista de abajo.`, 'error');
  }
  if(navMapObj){try{navMapObj.remove();}catch(e){}navMapObj=null;}
  navRoutingCtrl=null;userMarker=null;
  navMapObj=L.map('nav-map').setView([FABRICA.lat,FABRICA.lon],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(navMapObj);
  const fabIcon=L.divIcon({html:`<div style="background:#E53E3E;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid #fff">🏭</div>`,className:'',iconSize:[32,32],iconAnchor:[16,16]});
  L.marker([FABRICA.lat,FABRICA.lon],{icon:fabIcon}).addTo(navMapObj).bindPopup(`<strong>Punto de partida</strong><br>${FABRICA.direccion}`).openPopup();
  paradas.forEach((p,i)=>{
    const icon=L.divIcon({html:`<div style="background:#3B82F6;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid #fff">${i+1}</div>`,className:'',iconSize:[28,28],iconAnchor:[14,14]});
    L.marker([parseFloat(p.lat),parseFloat(p.lon)],{icon}).addTo(navMapObj).bindPopup(`<strong>${i+1}. ${p.cliente}</strong><br>${p.direccion}`);
  });
  updateNavDisplay();bindNavButtons();trazarRutaNav(paradas);iniciarGPS();
}

function trazarRutaNav(paradas,origenOverride=null){
  if(!paradas.length)return;
  let origen=origenOverride?L.latLng(origenOverride.lat,origenOverride.lon):state.userPosition?L.latLng(state.userPosition.lat,state.userPosition.lon):L.latLng(FABRICA.lat,FABRICA.lon);
  const wp=[origen,...paradas.slice(navParadaActual).map(p=>L.latLng(parseFloat(p.lat),parseFloat(p.lon)))];
  if(navRoutingCtrl){try{navRoutingCtrl.remove();}catch(e){}navRoutingCtrl=null;}
  if(wp.length<2)return;
  navRoutingCtrl=L.Routing.control({waypoints:wp,router:L.Routing.osrmv1({serviceUrl:'https://router.project-osrm.org/route/v1',language:'es'}),lineOptions:{styles:[{color:'#1a73e8',weight:6,opacity:.9}]},createMarker:()=>null,addWaypoints:false,draggableWaypoints:false,fitSelectedRoutes:true,show:false}).addTo(navMapObj);
  navRoutingCtrl.on('routesfound',function(e){
    const route=e.routes[0];navInstructions=route.instructions||[];navInstrIdx=0;updateInstructionDisplay();
    const mins=Math.round(route.summary.totalTime/60),km=(route.summary.totalDistance/1000).toFixed(1);
    const eta=document.getElementById('nav-eta');if(eta)eta.textContent=`${km}km · ~${mins}min`;
  });
}

function iniciarGPS(){
  if(!navigator.geolocation)return;
  const iconGPS=L.divIcon({html:`<div style="background:#F5C518;border-radius:50%;width:20px;height:20px;border:3px solid #fff;box-shadow:0 0 0 3px rgba(245,197,24,.4)"></div>`,className:'',iconSize:[20,20],iconAnchor:[10,10]});
  let gpsInit=false,lastPos=null;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lon,accuracy}=pos.coords;state.userPosition={lat,lon};
    const gpsEl=document.getElementById('nav-gps-status');
    if(accuracy>300){if(gpsEl)gpsEl.innerHTML=`⚠️ GPS impreciso (±${Math.round(accuracy)}m)`;return;}
    if(gpsEl)gpsEl.innerHTML=`📍 GPS activo (±${Math.round(accuracy)}m)`;
    if(!userMarker){userMarker=L.marker([lat,lon],{icon:iconGPS,zIndexOffset:1000}).addTo(navMapObj);}else userMarker.setLatLng([lat,lon]);
    if(!gpsInit){gpsInit=true;navMapObj.setView([lat,lon],14);const p=(navViaje?.boletas||[]).filter(b=>b.lat&&b.lon);if(p.length)trazarRutaNav(p,{lat,lon});lastPos={lat,lon};return;}
    if(lastPos&&haversineJS(lat,lon,lastPos.lat,lastPos.lon)<0.08)return;
    lastPos={lat,lon};const p=(navViaje?.boletas||[]).filter(b=>b.lat&&b.lon);if(p.length)trazarRutaNav(p,{lat,lon});
    advanceInstruction(lat,lon);

    // El envío al servidor y la detección de desvío ahora los maneja
    // iniciarSeguimientoUbicacion() en segundo plano (ver RF09 arriba),
    // así funciona también cuando se navega con Google Maps.
    // Acá solo actualizamos el texto de estado del GPS en pantalla:
    if (navViaje?.boletas) {
      const paradas = navViaje.boletas.filter(b=>b.lat&&b.lon);
      if (paradas.length > 0) {
        const minDist = Math.min(...paradas.map(p=>haversineJS(lat,lon,parseFloat(p.lat),parseFloat(p.lon))));
        if (minDist > 0.5) {
          const gpsEl = document.getElementById('nav-gps-status');
          if (gpsEl) gpsEl.innerHTML = `⚠️ Desvío detectado (${(minDist*1000).toFixed(0)}m de la ruta)`;
        }
      }
    }
  },err=>{const el=document.getElementById('nav-gps-status');if(el)el.innerHTML='❌ GPS no disponible';},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}

function detenerGPS(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}userMarker=null;}

// =============================================
// RF09: Seguimiento de ubicación en segundo plano
// Se activa al iniciar el viaje, sin importar si el
// repartidor usa la navegación interna o Google Maps.
// =============================================
let bgWatchId=null, bgViaje=null, bgLastPos=null, bgLastSentTs=0;

function iniciarSeguimientoUbicacion(viaje){
  if(!navigator.geolocation || !viaje?.id) return;
  if(bgWatchId!==null && bgViaje?.id===viaje.id) return; // ya se está siguiendo este viaje
  detenerSeguimientoUbicacion();
  bgViaje=viaje; bgLastPos=null; bgLastSentTs=0;
  bgWatchId=navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lon,accuracy}=pos.coords;
    state.userPosition={lat,lon};
    if(accuracy>300)return; // GPS muy impreciso, no enviar

    const now=Date.now();
    const movioSuficiente=!bgLastPos||haversineJS(lat,lon,bgLastPos.lat,bgLastPos.lon)>0.03; // 30m
    const pasoTiempo=now-bgLastSentTs>15000; // 15s
    if(!movioSuficiente && !pasoTiempo)return;
    bgLastPos={lat,lon}; bgLastSentTs=now;

    if(state.user?.repartidor_id){
      api('tracking.php','POST',{
        action:'update', viaje_id:bgViaje.id,
        repartidor_id:state.user.repartidor_id, lat, lon, accuracy
      }).catch(()=>{});
    }

    // RF08: Detectar desvío de ruta (>500m del waypoint más cercano)
    const paradas=(bgViaje?.boletas||[]).filter(b=>b.lat&&b.lon);
    if(paradas.length>0){
      const minDist=Math.min(...paradas.map(p=>haversineJS(lat,lon,parseFloat(p.lat),parseFloat(p.lon))));
      if(minDist>0.5 && state.user?.repartidor_id){
        api('tracking.php','POST',{
          action:'desvio', viaje_id:bgViaje.id,
          repartidor_id:state.user.repartidor_id,
          mensaje:`${state.user.nombre} se desvió ${(minDist*1000).toFixed(0)}m de la ruta planificada`
        }).catch(()=>{});
      }
    }
  },()=>{/* error silencioso: seguimos intentando en el próximo fix */},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}

function detenerSeguimientoUbicacion(){
  if(bgWatchId!==null){navigator.geolocation.clearWatch(bgWatchId);bgWatchId=null;}
  bgViaje=null; bgLastPos=null; bgLastSentTs=0;
}

function updateNavDisplay(){
  const paradas=(navViaje?.boletas||[]).filter(b=>b.lat&&b.lon);
  const p=paradas[navParadaActual];if(!p)return;
  const sn=document.getElementById('nav-stop-name'),sa=document.getElementById('nav-stop-addr'),sm=document.getElementById('nav-stop-meta'),pg=document.getElementById('nav-progress');
  if(sn)sn.textContent=p.cliente;if(sa)sa.textContent=p.direccion;if(sm)sm.textContent=`⚖️ ${p.peso_kg} kg`;
  if(pg)pg.textContent=`Parada ${navParadaActual+1} / ${paradas.length}`;
  navMapObj?.setView([parseFloat(p.lat),parseFloat(p.lon)],16);
  navInstructions=[];navInstrIdx=0;updateInstructionDisplay();
}

function updateInstructionDisplay(){
  if(!navInstructions.length){const d=document.getElementById('nav-distance-next'),t=document.getElementById('nav-turn-text');if(d)d.textContent='Calculando...';if(t)t.textContent='Obteniendo ruta';return;}
  const instr=navInstructions[navInstrIdx]||navInstructions[navInstructions.length-1];
  const arrow=document.getElementById('nav-arrow-box'),distEl=document.getElementById('nav-distance-next'),turnEl=document.getElementById('nav-turn-text'),streetEl=document.getElementById('nav-street-name'),instrBox=document.getElementById('nav-instruction');
  if(arrow)arrow.textContent=getArrow(instr.type);
  if(distEl)distEl.textContent=instr.distance>1000?`${(instr.distance/1000).toFixed(1)} km`:`${Math.round(instr.distance)} m`;
  if(turnEl)turnEl.textContent=instr.text||'Continuar';
  if(streetEl&&navInstructions[navInstrIdx+1])streetEl.textContent='Luego: '+(navInstructions[navInstrIdx+1].text||'');
  if(instrBox)instrBox.style.background=(instr.type==='DestinationReached'||instr.type==='WaypointReached'||instr.type==='Arrive')?'#1B7340':'#1a73e8';
}

function advanceInstruction(lat,lon){
  if(!navInstructions.length||navInstrIdx>=navInstructions.length-1)return;
  const instr=navInstructions[navInstrIdx];
  if(instr.distance<30){navInstrIdx++;updateInstructionDisplay();}
}

function bindNavButtons(){
  document.getElementById('nav-next')?.addEventListener('click',()=>{
    const p=(navViaje?.boletas||[]).filter(b=>b.lat&&b.lon);
    if(navParadaActual<p.length-1){navParadaActual++;updateNavDisplay();trazarRutaNav(p,state.userPosition);}
    else if(confirm('¿Llegaste a la última parada? ¿Finalizar el viaje?'))finalizarViaje(navViaje.id);
  });
  document.getElementById('nav-prev')?.addEventListener('click',()=>{
    if(navParadaActual>0){navParadaActual--;updateNavDisplay();const p=(navViaje?.boletas||[]).filter(b=>b.lat&&b.lon);trazarRutaNav(p,state.userPosition);}
  });
  document.getElementById('nav-fin')?.addEventListener('click',()=>{if(confirm('¿Finalizar el viaje?'))finalizarViaje(navViaje.id);});
}

// =============================================
// HELPERS
// =============================================
function haversineJS(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,e=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e));}

function logout(){detenerSeguimientoUbicacion();borrarSesion();state.user=null;state.page='boletas';render();}

function formatTime(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}

function applyModo(){const m=localStorage.getItem('tr_modo')||'oscuro';document.body.classList.toggle('modo-claro',m==='claro');}

function toggleModo(){const a=localStorage.getItem('tr_modo')||'oscuro',n=a==='oscuro'?'claro':'oscuro';localStorage.setItem('tr_modo',n);applyModo();render();}

applyModo();
render();
</script>
