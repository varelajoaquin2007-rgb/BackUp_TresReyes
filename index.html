<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tres Reyes — Logística</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde:    #1B7340;
      --verde-cl: #2ecc71;
      --negro:    #0D0D0D;
      --gris-os:  #1A1A1A;
      --gris-md:  #2C2C2C;
      --gris-cl:  #444;
      --texto:    #F0F0F0;
      --texto-2:  #999;
      --fondo:    #111;
      --card:     #1E1E1E;
      --borde:    #2E2E2E;
      --amarillo: #F5C518;
      --rojo:     #E53E3E;
      --azul:     #3B82F6;
    }

    /* ---- MODO CLARO ---- */
    body.modo-claro {
      --gris-os:  #f5f5f5;
      --gris-md:  #e8e8e8;
      --gris-cl:  #d0d0d0;
      --texto:    #111111;
      --texto-2:  #555555;
      --fondo:    #ffffff;
      --card:     #f9f9f9;
      --borde:    #dddddd;
      --negro:    #ffffff;
    }
    body.modo-claro .sidebar         { background:#f0f0f0; border-color:#ddd; }
    body.modo-claro .sidebar-logo    { border-color:#ddd; }
    body.modo-claro .sidebar-footer  { border-color:#ddd; }
    body.modo-claro .nav-item:hover  { background:#e0e0e0; }
    body.modo-claro .nav-item.active { background:rgba(27,115,64,.08); }
    body.modo-claro input, body.modo-claro select, body.modo-claro textarea {
      background:#fff; border-color:#ccc; color:#111;
    }
    body.modo-claro .rep-header { background:var(--verde); }
    body.modo-claro #nav-subbar { background:#0d47a1; }
    body { font-family: 'Inter', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; font-size: 18px; }
    #app { min-height: 100vh; }

    /* ---- GENERAL ---- */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-size:18px; font-weight:600; font-family:inherit; transition:all .15s; }
    .btn-primary   { background:var(--verde);    color:#fff; }
    .btn-primary:hover   { background:#145c30; }
    .btn-secondary { background:var(--gris-md);  color:var(--texto); }
    .btn-secondary:hover { background:var(--gris-cl); }
    .btn-danger    { background:var(--rojo);      color:#fff; }
    .btn-danger:hover    { background:#c0392b; }
    .btn-warning   { background:var(--amarillo);  color:#111; }
    .btn-sm { padding:6px 12px; font-size:18px; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }

    input, select, textarea {
      background:var(--gris-md); border:1px solid var(--borde); color:var(--texto);
      padding:10px 14px; border-radius:8px; font-size:18px; font-family:inherit; width:100%;
      outline:none; transition:border .15s;
    }
    input:focus, select:focus, textarea:focus { border-color:var(--verde); }
    /* Quita el fondo sombreado (amarillo/gris) que Chrome pone en los
       campos autocompletados al iniciar sesión: mantiene el fondo y el
       color de texto propios de la app. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px var(--gris-md) inset !important;
      -webkit-text-fill-color: var(--texto) !important;
      caret-color: var(--texto);
      transition: background-color 9999s ease-in-out 0s;
    }
    body.modo-claro input:-webkit-autofill,
    body.modo-claro input:-webkit-autofill:hover,
    body.modo-claro input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #fff inset !important;
      -webkit-text-fill-color: #111 !important;
    }
    label { font-size:18px; color:var(--texto-2); margin-bottom:4px; display:block; }

    .card { background:var(--card); border:1px solid var(--borde); border-radius:12px; padding:20px; }
    .tag  { display:inline-block; padding:3px 10px; border-radius:20px; font-size:18px; font-weight:600; }
    .tag-verde    { background:#1B7340; color:#fff; }
    .tag-amarillo { background:#b7860b; color:#fff; }
    .tag-rojo     { background:#7a1c1c; color:#fff; }
    .tag-azul     { background:#1e3a6e; color:#fff; }
    .tag-gris     { background:#333;   color:#aaa; }

    /* ---- LOGIN ---- */
    #login-screen {
      min-height:100vh; display:flex; align-items:stretch; background:#000;
    }
    .login-left {
      flex:1; display:none; align-items:center; justify-content:center;
      background:#000; border-right:1px solid #1a1a1a;
    }
    @media(min-width:768px){ .login-left { display:flex; } }

    .login-brand { text-align:center; padding:48px; }
    .marca-texto {
      font-family:'Playfair Display','Georgia',serif;
      font-size:52px; font-weight:900; color:#fff;
      letter-spacing:8px; text-transform:uppercase;
      text-shadow:0 2px 40px rgba(212,175,55,.15);
      line-height:1;
    }
    .marca-sub {
      font-family:'DM Sans',sans-serif;
      font-size:18px; font-weight:600; color:#D4AF37;
      letter-spacing:6px; text-transform:uppercase;
      margin-top:12px;
    }
    .marca-sub span { opacity:.7; margin:0 6px; }
    .login-brand .desc {
      margin-top:40px; font-size:18px; color:rgba(255,255,255,.35);
      line-height:1.7; max-width:260px; margin-left:auto; margin-right:auto;
    }

    .login-right {
      width:100%; max-width:460px; display:flex; align-items:center;
      justify-content:center; padding:48px 40px; background:#111;
    }
    @media(min-width:768px){ .login-right { min-width:420px; } }
    .login-form-wrap { width:100%; max-width:360px; }

    .mobile-brand { display:block; text-align:center; margin-bottom:36px; }
    @media(min-width:768px){ .mobile-brand { display:none; } }

    .login-form-wrap h2 { font-size:22px; font-weight:700; margin-bottom:6px; }
    .login-form-wrap .bienvenida { font-size:18px; color:var(--texto-2); margin-bottom:28px; }
    .form-group { margin-bottom:18px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

        /* ---- LAYOUT ADMIN ---- */
    .layout { display:flex; min-height:100vh; }
    .sidebar {
      width:220px; flex-shrink:0; background:var(--gris-os); border-right:1px solid var(--borde);
      display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100;
    }
    .sidebar-logo { padding:24px 20px 16px; border-bottom:1px solid var(--borde); }
    .sidebar-logo h2 { font-family:'DM Sans',sans-serif; font-size:18px; font-weight:700; color:#fff; }
    .sidebar-logo span { font-size:18px; color:var(--texto-2); }
    .sidebar nav { flex:1; padding:12px 0; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:10px 20px; cursor:pointer;
      color:var(--texto-2); font-size:18px; font-weight:500; transition:all .15s; border-left:3px solid transparent;
    }
    .nav-item:hover   { color:var(--texto);  background:var(--gris-md); }
    .nav-item.active  { color:var(--verde-cl); border-left-color:var(--verde); background:rgba(27,115,64,.1); }
    .nav-item .badge {
      margin-left:auto; background:var(--rojo); color:#fff; border-radius:10px;
      padding:1px 7px; font-size:18px;
    }
    .sidebar-footer { padding:16px 20px; border-top:1px solid var(--borde); }
    .user-chip { display:flex; align-items:center; gap:10px; }
    .user-avatar {
      width:36px; height:36px; border-radius:50%; background:var(--verde);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;
    }
    .user-info small { color:var(--texto-2); font-size:18px; display:block; }

    .main-content { margin-left:220px; flex:1; padding:28px; }
    .page-header { margin-bottom:24px; }
    .page-header h1 { font-size:24px; font-weight:700; }
    .page-header p  { color:var(--texto-2); font-size:18px; margin-top:4px; }

    /* ---- STATS ---- */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card { background:var(--card); border:1px solid var(--borde); border-radius:12px; padding:20px; }
    .stat-card .num { font-size:32px; font-weight:700; color:var(--verde-cl); }
    .stat-card .lbl { font-size:18px; color:var(--texto-2); margin-top:4px; }

    /* ---- BOLETAS ---- */
    .boletas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
    .boleta-card {
      background:var(--card); border:1px solid var(--borde); border-radius:10px;
      padding:14px; position:relative;
    }
    .boleta-card.geocoded { border-left:3px solid var(--verde); }
    .boleta-card.sin-geo  { border-left:3px solid var(--amarillo); }
    .boleta-nombre { font-weight:600; font-size:18px; margin-bottom:4px; }
    .boleta-dir    { font-size:18px; color:var(--texto-2); margin-bottom:8px; }
    .boleta-footer { display:flex; align-items:center; justify-content:space-between; }
    .boleta-peso   { font-size:18px; font-weight:600; color:var(--verde-cl); }
    .delete-btn    { background:none; border:none; color:var(--rojo); cursor:pointer; font-size:16px; padding:2px; }

    /* ---- VIAJES ADMIN ---- */
    .viaje-card {
      background:var(--card); border:1px solid var(--borde); border-radius:12px;
      margin-bottom:16px; overflow:hidden;
    }
    .viaje-header {
      padding:16px 20px; background:var(--gris-md); display:flex;
      align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .viaje-header h3 { font-size:16px; font-weight:600; }
    .viaje-body { padding:16px 20px; }
    .parada-row {
      display:flex; align-items:flex-start; gap:12px; padding:10px 0;
      border-bottom:1px solid var(--borde);
    }
    .parada-row:last-child { border-bottom:none; }
    .parada-num {
      width:28px; height:28px; border-radius:50%; background:var(--verde); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex-shrink:0;
    }
    .parada-info { flex:1; }
    .parada-cliente { font-weight:600; font-size:18px; }
    .parada-dir     { font-size:18px; color:var(--texto-2); margin-top:2px; }
    .parada-peso    { font-size:18px; color:var(--verde-cl); margin-top:2px; font-weight:600; }

    /* ---- MAPA ---- */
    #map-container { height:400px; border-radius:12px; overflow:hidden; margin-bottom:16px; border:1px solid var(--borde); }
    #nav-map { height:100vh; }

    /* ---- REPARTIDOR ---- */
    .rep-layout { min-height:100vh; display:flex; flex-direction:column; }
    .rep-header {
      background:var(--verde); padding:16px 20px; display:flex;
      align-items:center; justify-content:space-between;
    }
    .rep-header h1 { font-size:18px; font-weight:700; }
    .rep-content { flex:1; padding:16px; max-width:600px; margin:0 auto; width:100%; }

    .viaje-rep-card {
      background:var(--card); border:1px solid var(--borde); border-radius:12px;
      margin-bottom:16px;
    }
    .viaje-rep-header {
      padding:14px 16px; background:var(--gris-md); border-radius:12px 12px 0 0;
      display:flex; align-items:center; justify-content:space-between;
    }
    .parada-rep {
      display:flex; align-items:flex-start; gap:12px; padding:12px 16px;
      border-bottom:1px solid var(--borde); transition:background .15s;
    }
    .parada-rep.entregada { opacity:.5; }
    .parada-rep.entregada .parada-cliente { text-decoration:line-through; }
    .parada-rep:last-child { border-bottom:none; }
    .check-btn {
      background:none; border:2px solid var(--borde); border-radius:50%;
      width:28px; height:28px; cursor:pointer; flex-shrink:0; transition:all .15s;
      display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .check-btn.done { background:var(--verde); border-color:var(--verde); color:#fff; }

    /* ---- NAV FULLSCREEN - Google Maps style ---- */
    #nav-screen { display:none; position:fixed; inset:0; z-index:1000; background:#000; flex-direction:column; }
    #nav-screen.active { display:flex; }

    /* Instrucción principal - arriba */
    #nav-instruction {
      background:#1a73e8; color:#fff; padding:14px 16px;
      display:flex; align-items:center; gap:14px; z-index:10; flex-shrink:0;
      min-height:80px;
    }
    #nav-arrow-box {
      width:52px; height:52px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(255,255,255,.15); border-radius:10px; font-size:28px;
    }
    #nav-instruction-text { flex:1; }
    #nav-distance-next { font-size:22px; font-weight:700; line-height:1; }
    #nav-turn-text { font-size:18px; opacity:.9; margin-top:3px; }
    #nav-street-name { font-size:18px; opacity:.7; margin-top:2px; }

    /* Barra secundaria */
    #nav-subbar {
      background:#0d47a1; color:#fff; padding:6px 16px;
      display:flex; align-items:center; justify-content:space-between;
      font-size:18px; flex-shrink:0;
    }
    #nav-gps-status { font-size:18px; opacity:.8; }

    /* Mapa */
    #nav-map { flex:1; }

    /* Footer con parada actual */
    #nav-footer {
      background:#1E1E1E; border-top:1px solid #333;
      padding:12px 16px; flex-shrink:0;
    }
    #nav-stop-info { margin-bottom:10px; }
    #nav-stop-name { font-size:18px; font-weight:700; }
    #nav-stop-addr { font-size:18px; color:var(--texto-2); margin-top:2px; }
    #nav-stop-meta { font-size:18px; color:var(--verde-cl); margin-top:3px; }
    #nav-btns { display:flex; gap:10px; }

    /* ---- UPLOAD DROP ---- */
    .drop-zone {
      border:2px dashed var(--borde); border-radius:12px; padding:40px; text-align:center;
      cursor:pointer; transition:all .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color:var(--verde); background:rgba(27,115,64,.05); }
    .drop-zone .icon { font-size:40px; margin-bottom:12px; }
    .drop-zone h3    { font-size:16px; font-weight:600; margin-bottom:6px; }
    .drop-zone p     { font-size:18px; color:var(--texto-2); }

    /* ---- ALERTAS ---- */
    .alerta-item {
      display:flex; align-items:center; gap:14px; padding:14px;
      background:var(--card); border:1px solid var(--borde); border-radius:10px; margin-bottom:10px;
    }
    .alerta-icon { font-size:24px; }
    .alerta-text h4 { font-size:18px; font-weight:600; }
    .alerta-text p  { font-size:18px; color:var(--texto-2); margin-top:2px; }

    /* ---- UTILITIES ---- */
    .flex { display:flex; }
    .items-center { align-items:center; }
    .gap-2 { gap:8px; }
    .gap-3 { gap:12px; }
    .mt-2  { margin-top:8px; }
    .mt-4  { margin-top:16px; }
    .mb-4  { margin-bottom:16px; }
    .text-sm   { font-size:18px; }
    .text-muted{ color:var(--texto-2); }
    .text-green{ color:var(--verde-cl); }
    .font-bold { font-weight:700; }
    .w-full { width:100%; }
    .toast {
      position:fixed; bottom:24px; right:24px; background:var(--gris-md);
      border:1px solid var(--borde); border-radius:10px; padding:14px 20px;
      font-size:18px; z-index:9999; animation:slideIn .2s ease;
      max-width:320px; box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    .toast.success { border-left:4px solid var(--verde); }
    .toast.error   { border-left:4px solid var(--rojo); }
    @keyframes slideIn { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

    .loading { display:flex; align-items:center; justify-content:center; padding:40px; color:var(--texto-2); gap:10px; }
    .spinner { width:20px; height:20px; border:2px solid var(--borde); border-top-color:var(--verde); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Ocultar panel de instrucciones de Leaflet Routing Machine */
    .leaflet-routing-container { display: none !important; }
    .leaflet-routing-alt { display: none !important; }

    .section-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--gris-md); padding:4px; border-radius:10px; }
    .tab-btn { flex:1; padding:8px; border:none; border-radius:7px; cursor:pointer; font-size:18px; font-weight:600; font-family:inherit; background:transparent; color:var(--texto-2); transition:all .15s; }
    .tab-btn.active { background:var(--verde); color:#fff; }

    select option { background:var(--gris-md); }

    @media(max-width:768px) {
      .main-content { margin-left:0; padding:16px; padding-top:64px; }
      .sidebar {
        position:fixed; top:0; left:0; height:100vh; z-index:1000;
        transform:translateX(-100%); transition:transform .25s ease;
        box-shadow:2px 0 12px rgba(0,0,0,.4);
      }
      .sidebar.open { transform:translateX(0); }
      .mobile-topbar {
        display:flex; position:fixed; top:0; left:0; right:0; height:56px;
        background:var(--gris-md); border-bottom:1px solid var(--borde);
        align-items:center; padding:0 16px; z-index:900; gap:12px;
      }
      .mobile-topbar h3 { margin:0; font-size:16px; }
      .sidebar-overlay {
        display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999;
      }
      .sidebar-overlay.open { display:block; }
      .hamburger-btn {
        background:none; border:none; color:var(--texto); font-size:24px; cursor:pointer;
        padding:4px 8px; line-height:1;
      }
    }
    @media(min-width:769px) {
      .mobile-topbar, .sidebar-overlay { display:none; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// =============================================
// CONFIGURACIÓN
// =============================================
const API = 'https://tresreyes.turbologistica.com';

// Punto de partida fijo: Fábrica Tres Reyes
// Mapa del panel de administrador con Google Maps JavaScript API. Esta
// key viaja al navegador (es lo normal para Maps JS); lo que la protege
// es la restricción por dominio configurada en Google Cloud.
const GOOGLE_MAPS_KEY = 'TU_KEY_DE_NAVEGADOR';
let googleMapsPromise = null;
function cargarGoogleMaps() {
  // OJO: sin "&loading=async". Con ese parámetro, Google no deja lista
  // la librería al terminar de cargar el script — hay que pedirla aparte
  // con importLibrary(), y si no se hace así, "new google.maps.Map(...)"
  // puede fallar con "is not a constructor" (pasaba de forma
  // intermitente, según si la librería ya había terminado de armarse o
  // no en ese momento). Sin el parámetro, el modo de carga es el
  // clásico: al terminar el script, todo está listo para usar.
  if (window.google && window.google.maps && window.google.maps.Map) return Promise.resolve();
  if (googleMapsPromise) return googleMapsPromise;
  googleMapsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}`;
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('No se pudo cargar Google Maps'));
    document.head.appendChild(s);
  });
  return googleMapsPromise;
}

const FABRICA = {
  lat: -34.547362,
  lon: -58.709439,
  nombre: 'Fábrica Tres Reyes',
  direccion: 'Martin de Irigoyen 1217, San Miguel, Buenos Aires'
};
// NOTA: ya no hay un punto de finalización fijo por defecto ("cochera").
// Se elige por viaje en Configuración → Destinos; sin ninguno elegido,
// el viaje termina en la última entrega.
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// =============================================
// ESTADO GLOBAL
// =============================================
// Fecha local (Argentina) en formato YYYY-MM-DD. OJO: no usar
// toISOString() para esto — convierte a UTC y de noche (después de las
// 21hs en Argentina) devuelve el día siguiente, lo que hacía que un
// viaje cargado a la noche quedara con una fecha distinta a "hoy".
function fechaLocal(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Marca de versión: si en la consola del navegador (F12) ves este
// mensaje al cargar la página, tenés la versión más nueva del código.
// Si NO lo ves, el navegador está mostrando una copia vieja guardada.
console.log('%c[TR] Versión cargada: 2026-09-21-separar-marcadores-superpuestos', 'color:#2ecc71;font-weight:bold');

// "Mantener sesión iniciada": con la casilla tildada el usuario se guarda en
// localStorage (sobrevive al cerrar el navegador) por SESION_DIAS días; sin
// tildar, solo en sessionStorage (se pierde al cerrar la pestaña).
const SESION_DIAS = 30;
function guardarSesion(usuario, mantener) {
  try {
    sessionStorage.setItem('tr_user', JSON.stringify(usuario));
    if (mantener) {
      localStorage.setItem('tr_user', JSON.stringify({ usuario, expira: Date.now() + SESION_DIAS*24*60*60*1000 }));
      localStorage.setItem('tr_mantener', '1');
    } else {
      localStorage.removeItem('tr_user');
      localStorage.removeItem('tr_mantener');
    }
  } catch (e) {}
}
function cargarSesion() {
  try {
    const s = sessionStorage.getItem('tr_user');
    if (s) return JSON.parse(s);
    const l = JSON.parse(localStorage.getItem('tr_user') || 'null');
    if (l && l.usuario && l.expira > Date.now()) return l.usuario;
    localStorage.removeItem('tr_user');
  } catch (e) {}
  return null;
}
function borrarSesion() {
  try { sessionStorage.removeItem('tr_user'); localStorage.removeItem('tr_user'); } catch (e) {}
}

// =============================================
// API HELPERS
// =============================================
async function api(endpoint, method='GET', body=null) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(`${API}/${endpoint}`, opts);
    const raw = await r.text();
    try {
      return JSON.parse(raw);
    } catch (e) {
      // El backend devolvió algo que no es JSON (típicamente un error PHP
      // fatal, por ejemplo si falta correr la migración de la base de
      // datos). Mostramos el motivo real en vez de fallar en silencio.
      console.error('[TR API] Respuesta no-JSON de', endpoint, ':', raw);
      return { success:false, message: 'Error del servidor al llamar '+endpoint+'. Revisá la consola del navegador para más detalle.' };
    }
  } catch (e) {
    console.error('[TR API] Error de red en', endpoint, e);
    return { success:false, message: 'No se pudo conectar con el servidor.' };
  }
}

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function irAVistaLogin(view) {
  state.loginView = view;
  // Limpiamos el token de la URL al volver al login normal, para que
  // un refresh no te vuelva a mandar a la pantalla de "nueva contraseña"
  if (view === 'login' && window.history?.replaceState) {
    window.history.replaceState({}, '', window.location.pathname);
  }
  render();
}

function bindLogin() {
  const view = state.loginView || 'login';

  if (view === 'login') {
    const btn  = document.getElementById('l-btn');
    const pass = document.getElementById('l-pass');
    const err  = document.getElementById('l-err');

    async function doLogin() {
      btn.disabled = true; btn.textContent = 'Ingresando...';
      try {
        const r = await api('login.php','POST',{email:document.getElementById('l-email').value.trim(),password:pass.value});
        if (r.success) {
          state.user = r.usuario;
          guardarSesion(r.usuario, document.getElementById('l-mantener')?.checked);
          render();
        } else {
          err.textContent = r.message; err.style.display='block';
        }
      } catch(e) { err.textContent='Error de conexión'; err.style.display='block'; }
      btn.disabled=false; btn.textContent='Ingresar';
    }

    btn.addEventListener('click', doLogin);
    const emailEl = document.getElementById('l-email');
    [emailEl, pass].forEach(el => el?.addEventListener('keydown', e => e.key==='Enter' && doLogin()));

    document.getElementById('l-olvide')?.addEventListener('click', e => {
      e.preventDefault(); irAVistaLogin('recuperar');
    });
  }

  else if (view === 'recuperar') {
    const btn = document.getElementById('r-btn');
    const msg = document.getElementById('r-msg');

    async function doSolicitar() {
      btn.disabled = true; btn.textContent = 'Enviando...';
      msg.style.display = 'none';
      try {
        const r = await api('recuperar.php','POST',{action:'solicitar'});
        msg.textContent = r.message || 'Listo.';
        msg.style.color = r.success ? 'var(--verde,#1B7340)' : 'var(--rojo)';
        msg.style.display = 'block';
      } catch(e) {
        msg.textContent = 'Error de conexión'; msg.style.color='var(--rojo)'; msg.style.display='block';
      }
      btn.disabled = false; btn.textContent = 'Enviar link de recuperación →';
    }

    btn.addEventListener('click', doSolicitar);
    document.getElementById('r-volver')?.addEventListener('click', e => {
      e.preventDefault(); irAVistaLogin('login');
    });
  }

  else if (view === 'reset') {
    const btn = document.getElementById('nr-btn');
    const msg = document.getElementById('nr-msg');
    const p1  = document.getElementById('nr-pass');
    const p2  = document.getElementById('nr-pass2');

    async function doResetear() {
      msg.style.display = 'none';
      if (!p1.value || p1.value.length < 6) {
        msg.textContent = 'La contraseña debe tener al menos 6 caracteres'; msg.style.color='var(--rojo)'; msg.style.display='block'; return;
      }
      if (p1.value !== p2.value) {
        msg.textContent = 'Las contraseñas no coinciden'; msg.style.color='var(--rojo)'; msg.style.display='block'; return;
      }
      btn.disabled = true; btn.textContent = 'Guardando...';
      try {
        const r = await api('recuperar.php','POST',{action:'resetear', token: state.resetToken, password: p1.value});
        msg.textContent = r.message || 'Listo.';
        msg.style.color = r.success ? 'var(--verde,#1B7340)' : 'var(--rojo)';
        msg.style.display = 'block';
        if (r.success) {
          btn.style.display = 'none';
          setTimeout(() => irAVistaLogin('login'), 1800);
        }
      } catch(e) {
        msg.textContent = 'Error de conexión'; msg.style.color='var(--rojo)'; msg.style.display='block';
      }
      btn.disabled = false; if (btn.style.display !== 'none') btn.textContent = 'Guardar nueva contraseña →';
    }

    btn.addEventListener('click', doResetear);
    p2?.addEventListener('keydown', e => e.key==='Enter' && doResetear());
  }
}

function bindAdmin() {
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.addEventListener('click', () => {
      state.page = el.dataset.page;
      loadCurrentAdminPage();
      // En mobile, navegar cierra el menú desplegable solo.
      document.getElementById('sidebar')?.classList.remove('open');
      document.getElementById('sidebar-overlay')?.classList.remove('open');
    });
  });
  document.getElementById('logout-btn')?.addEventListener('click', logout);
  document.getElementById('toggle-modo-btn')?.addEventListener('click', toggleModo);
  document.getElementById('hamburger-btn')?.addEventListener('click', () => {
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('open');
  });
  document.getElementById('sidebar-overlay')?.addEventListener('click', () => {
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('open');
  });
  loadCurrentAdminPage();
  refreshPospuestasCount();
}

async function refreshPospuestasCount() {
  const r = await api('boletas.php?pospuestas=1');
  const count = r.success ? (r.boletas || []).length : 0;
  if (count !== state.pospuestasCount) {
    state.pospuestasCount = count;
    // Re-render only the nav badge (no full re-render)
    document.querySelectorAll('.nav-item[data-page="pospuestas"]').forEach(el => {
      const existing = el.querySelector('.pospuestas-badge');
      if (existing) existing.remove();
      if (count > 0) {
        const badge = document.createElement('span');
        badge.className = 'pospuestas-badge';
        badge.style.cssText = 'background:var(--rojo,#e53e3e);color:#fff;border-radius:9999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto';
        badge.textContent = count;
        el.appendChild(badge);
      }
    });
  }
}

function loadCurrentAdminPage() {
  const main = document.getElementById('admin-main');
  if (!main) return;

  // Update active nav highlight
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.classList.toggle('active', el.dataset.page === state.page);
  });

  // Título de la barra superior de mobile (el menú lateral queda oculto
  // ahí, así que este título es la única referencia de en qué pantalla
  // está parado el admin).
  const navTitles = {
    boletas:'📄 Boletas', armar:'🗺️ Viajes pendientes', pospuestas:'📋 Boletas pospuestas',
    viajes:'🚛 Viajes del día', historico:'🗂️ Histórico de viajes', tracking:'📡 Tracking',
    alertas:'🔔 Alertas', reportes:'📊 Reportes', config:'⚙️ Configuración',
  };
  const topbarTitle = document.querySelector('.mobile-topbar h3');
  if (topbarTitle) topbarTitle.textContent = navTitles[state.page] || 'Tres Reyes';

  if (state.page === 'boletas') {
    main.innerHTML = renderBoletas();
    bindBoletasPage();
    loadBoletasInto();
  } else if (state.page === 'armar') {
    main.innerHTML = renderArmar();
    bindArmarPage();
  } else if (state.page === 'pospuestas') {
    main.innerHTML = renderPospuestasPage();
    cargarPospuestasPage();
  } else if (state.page === 'viajes') {
    main.innerHTML = renderViajesAdmin();
    loadViajesAdmin();
  } else if (state.page === 'historico') {
    main.innerHTML = renderHistorico();
    loadHistorico();
  } else if (state.page === 'alertas') {
    main.innerHTML = renderAlertas();
    loadAlertas();
  } else if (state.page === 'tracking') {
    main.innerHTML = renderTracking();
    loadTracking();
  } else if (state.page === 'reportes') {
    main.innerHTML = renderReportes();
    loadReportes();
  } else if (state.page === 'config') {
    main.innerHTML = renderConfig();
    bindConfig();
    loadConfig();
  }
}

            <input type="text" id="edit-zona-${b.id}" value="${b.zona||''}" style="width:100%" />
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-primary btn-sm" data-guardar-edit="${b.id}">Guardar</button>
          <button class="btn btn-secondary btn-sm" data-cancelar-edit="${b.id}">Cancelar</button>
        </div>
      </div>
    </div>`).join('') || '<p class="text-muted">No hay boletas para esta fecha.</p>'}
  </div>`;
}

async function loadBoletasInto() {
  const r = await api(`boletas.php?fecha=${state.fechaSeleccionada}`);
  if (!r.success) return;
  state.boletas = r.boletas;
  const main = document.getElementById('admin-main');
  if (!main) return;
  if (state.page === 'boletas') {
    main.innerHTML = renderBoletas();
    bindBoletasPage();
  }
}

async function loadBoletas() {
  await loadBoletasInto();
}

function bindBoletasPage() {
  // Fecha
  document.getElementById('fecha-sel')?.addEventListener('change', e => {
    state.fechaSeleccionada = e.target.value;
    loadBoletas();
  });
  document.getElementById('refresh-boletas')?.addEventListener('click', loadBoletas);

  // PDF drop
  const drop = document.getElementById('drop-zone');
  const input = document.getElementById('pdf-input');
  drop?.addEventListener('click', () => input.click());
  drop?.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop?.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop?.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); processPDFs(e.dataTransfer.files); });
  input?.addEventListener('change', e => processPDFs(e.target.files));

  // Delete buttons (borrar boleta). Ahora se puede borrar en cualquier
  // estado; si está en un viaje confirmado/en curso, el backend la saca
  // y recalcula. Se apunta solo a los botones con título "Eliminar".
  document.querySelectorAll('.delete-btn[data-id]').forEach(btn => {
    if (btn.dataset.regeo || btn.dataset.editar) return;
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const b = state.boletas.find(x => String(x.id) === String(id));
      const enViaje = b && b.viaje_estado && b.viaje_estado !== 'armado';
      const msg = enViaje
        ? 'Esta boleta está en un viaje ya confirmado/en curso. Si la borrás, se quita de ese viaje y la boleta se elimina. ¿Continuar?'
        : '¿Eliminar esta boleta?';
      if (!confirm(msg)) return;
      const r = await api(`boletas.php?id=${id}`, 'DELETE');
      if (!r.success) { toast(r.message||'No se pudo borrar','error'); return; }
      await loadBoletas();
    });
  });

  // Editar dirección/localidad/zona de un cliente (abre el form inline)
  document.querySelectorAll('[data-editar]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const f = document.getElementById(`editar-form-${btn.dataset.editar}`);
      if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
    });
  });
  document.querySelectorAll('[data-cancelar-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = document.getElementById(`editar-form-${btn.dataset.cancelarEdit}`);
      if (f) f.style.display = 'none';
    });
  });
  document.querySelectorAll('[data-guardar-edit]').forEach(btn => {
    btn.addEventListener('click', () => guardarEdicionCliente(btn.dataset.guardarEdit));
  });

  // Reubicar una boleta puntual (por si el mapa la puso en otro lado)
  document.querySelectorAll('[data-regeo]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const boleta = state.boletas.find(b => String(b.id) === btn.dataset.regeo);
      if (!boleta) return;
      btn.textContent = '⏳';
      const res = await geocodificarBoleta(boleta);
      const msg = res === 'exacta' ? '✅ Ubicación actualizada'
                : res === 'aproximada' ? '⚠️ No se encontró la dirección exacta, quedó ubicada aproximadamente (revisala en el mapa)'
                : '⚠️ No se encontró esa dirección ni siquiera aproximada';
      toast(msg, res ? undefined : 'error');
      await loadBoletas();
    });
  });

  // Geo all
  document.getElementById('geo-all-btn')?.addEventListener('click', geocodificarTodas);

}

async function guardarEdicionCliente(id) {
  const direccion = document.getElementById(`edit-dir-${id}`).value.trim();
  const barrio = document.getElementById(`edit-loc-${id}`).value.trim();
  const zona = document.getElementById(`edit-zona-${id}`).value.trim();
  const cp = document.getElementById(`edit-cp-${id}`)?.value.trim() || '';
  if (!direccion) { toast('La dirección no puede quedar vacía', 'error'); return; }

  const r = await api('boletas.php', 'POST', { action:'editar_cliente', id:parseInt(id), direccion, barrio, zona, cp });
  if (!r.success) { toast(r.message || 'No se pudo guardar', 'error'); return; }

  // Si cambió la dirección/localidad, hay que volver a ubicar en el mapa.
  if (r.regeocodificar) {
    toast('📍 Dirección cambiada, volviendo a ubicar en el mapa...');
    await loadBoletas();
    const boleta = state.boletas.find(b => String(b.id) === String(id));
    if (boleta) {
      const res = await geocodificarBoleta(boleta);
      toast(res ? '✅ Cliente actualizado y reubicado' : '⚠️ Actualizado, pero no se encontró la nueva dirección — revisá con 📍', res ? undefined : 'error');
    }
  } else {
    toast('✅ Cliente actualizado');
  }
  await loadBoletas();
}
