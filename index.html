async function processPDFs(files) {
  document.getElementById('pdf-progress').style.display = 'block';
  const boletas = [];
  const fallidos = []; // nombres de archivo que no se pudieron leer

  const lista = Array.from(files).filter(f => f.name.endsWith('.pdf'));

  for (const file of lista) {
    try {
      const text = await extractPDFText(file);
      const parsed = parseBoleta(text);
      if (parsed && parsed.length) {
        boletas.push(...parsed);
      } else {
        fallidos.push(file.name);
      }
    } catch (e) {
      console.error('[TR] Error leyendo', file.name, e);
      fallidos.push(file.name);
    }
  }

  document.getElementById('pdf-progress').style.display = 'none';

  if (boletas.length === 0) {
    toast(`No se pudo extraer datos de ningún PDF (${lista.length} archivo${lista.length!==1?'s':''}). Verificá el formato.`, 'error');
    return;
  }

  const r = await api('boletas.php','POST',{
    action:'bulk', fecha:state.fechaSeleccionada, boletas
  });

  if (r.success) {
    // Aviso claro de cuántos archivos se seleccionaron vs. cuántas
    // boletas realmente quedaron cargadas, para que ninguna se pierda
    // "en silencio" sin que el admin se entere.
    let msg = `✅ ${r.insertadas} de ${lista.length} boleta${lista.length!==1?'s':''} cargada${r.insertadas!==1?'s':''}.`;
    if (fallidos.length) {
      msg += ` ⚠️ No se pudieron leer: ${fallidos.join(', ')}`;
      toast(msg, 'error');
    } else if (r.insertadas < boletas.length) {
      toast(msg + ' Algunas no tenían cliente/dirección válidos.', 'error');
    } else {
      toast(msg + ' Geolocalizando...');
    }
    await loadBoletas();
    // Esperar que el DOM se actualice antes de geocodificar
    await new Promise(r => setTimeout(r, 500));
    await geocodificarTodas();
  } else {
    toast(r.message || 'No se pudieron guardar las boletas', 'error');
  }
}

async function extractPDFText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function parseBoleta(rawText) {
  // PASO 1: Limpiar texto. OJO: antes se borraba todo carácter no-ASCII,
  // pero eso también borra letras válidas con tilde/ñ (ej. "MUÑIZ" quedaba
  // "MU IZ"). Ahora solo se sacan símbolos raros y se conservan letras
  // (con acentos), números y la puntuación típica de una factura.
  const clean = rawText
    .replace(/[^\p{L}\p{N}\s.,\-\/()&:$%#]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  console.log('[TR Parser] Texto limpio:', clean.substring(0, 400));

  let cliente = '', direccion = '', peso = 0, localidad = '';

  // RAZON SOCIAL: después de "Razon Social:" hasta "Domicilio:"/"IVA:"/"CUIT:"
  // Muchos clientes tienen un alias entre paréntesis, ej:
  // "ANDRES RAPPAZZO (LACTEOS RONCHOS) 636" — hay que permitir "()" y ","
  // en el nombre, si no la extracción corta ahí y falla toda la boleta.
  let m = clean.match(/Razon\s*Social\s*:\s*([A-Z0-9][A-Z0-9\s\.\-\/&,\(\)]{2,100}?)(?=\s*(?:Domicilio|IVA|CUIT)\s*:)/i);
  if (m) {
    cliente = m[1].trim().replace(/\s+/g,' ');
    // Cuando el nombre ocupa 2 líneas en la factura, el CUIT queda
    // pegado en el medio y el paréntesis del alias queda sin cerrar
    // (ej. "ANDRES RAPPAZZO (LACTEOS" ... "CUIT: ... RONCHOS) 636").
    // Si detectamos un "(" sin su ")", buscamos la continuación justo
    // después del CUIT que sigue (ventana corta para no engancharnos
    // con otro CUIT del documento, como el de la empresa emisora).
    const abiertos = (cliente.match(/\(/g)||[]).length;
    const cerrados = (cliente.match(/\)/g)||[]).length;
    if (abiertos > cerrados) {
      const restante = clean.slice(m.index + m[0].length, m.index + m[0].length + 80);
      const cont = restante.match(/^\s*CUIT\s*:\s*[\d\-]+\s*([A-Z0-9][A-Z0-9\s\.\-\/&,\(\)]{0,40}?\)(?:\s*[0-9]+)?)/i);
      if (cont) cliente = `${cliente} ${cont[1].trim()}`.replace(/\s+/g,' ');
    }
  } else {
    // FORMATO 2 (nota de pedido / recibo): "Cliente :LA N 1 Direccion :..."
    // en vez de "Razon Social: ... Domicilio: ...". Puede traer un alias
    // entre paréntesis, igual que en Formato 1 (ej. "MATIAS PALAZZO (LAS
    // CALEAS) 674" o "(MAURICIO) 1147") — hay que permitir "()" en el
    // nombre, si no falla toda la extracción.
    const mc = clean.match(/Cliente\s*:\s*([A-Z0-9\u00C0-\u017F°\s\.\-\(\)]{2,60}?)(?=\s*Direccion\s*:)/i);
    if (mc) cliente = mc[1].trim().replace(/\s+/g,' ');
  }

  // ENTREGA: dirección de entrega real (tiene prioridad sobre Domicilio).
  // Formato 1: "Entrega: MONTEVERDE 567 (BARILOCHE) RIO NEGRO" ... "Zona:"
  // Formato 2: "Entrega : ..." ... "zona 1" (sin dos puntos) o "Vendedor :"
  // "Vendedor" también corta la captura: si Entrega viene vacío, el texto
  // sigue directo con "Vendedor :..." y sin este freno se leería eso como
  // si fuera la dirección.
  m = clean.match(/Entrega\s*:\s*([A-Z0-9\u00C0-\u017F ][A-Z0-9\u00C0-\u017F\s\.,\(\)\-\/]{4,120}?)(?=\s*(?:Zona|Remito|Condicion|Cant\.|Vendedor)\s*:?)/i);
  if (!m) {
    // Fallback menos estricto: tomar hasta 120 chars
    m = clean.match(/Entrega\s*:\s*([A-Z0-9\u00C0-\u017F ][A-Z0-9\u00C0-\u017F\s\.,\(\)\-\/]{4,120})/i);
    if (m) m[1] = m[1].substring(0, 120);
  }
  let entregaRaw = m ? m[1].trim().replace(/\s+/g,' ') : '';
  // Si "Entrega:" viene vacío, el intento de respaldo (menos estricto,
  // sin lista de palabras de corte) puede terminar agarrando la próxima
  // etiqueta del PDF como si fuera texto de dirección (ej. "Vendedor").
  // Si lo capturado es exactamente una de esas etiquetas, se descarta.
  if (/^(vendedor|zona|remito|condicion|cant\.?|horario)$/i.test(entregaRaw)) entregaRaw = '';

  // La localidad de ESTA entrega puntual, si el campo "Entrega" la trae
  // aclarada aparte (entre paréntesis, o separada por comas). Es más
  // confiable que la "Localidad:" general de la factura, que es la del
  // domicilio del cliente y puede no coincidir con la de la entrega real
  // — ej.: "Localidad: EL JAGUEL" pero "Entrega: ARTURO ILLIA 6136,
  // POLVORINES, B1613": hay que entregar en Polvorines, no en El Jagüel.
  let localidadEntrega = '';
  let cpEntrega = '';

  // Detecta un código postal argentino al final: CPA de 8 (B1613ABC),
  // de 5 (B1613) o el viejo de 4 dígitos (1613).
  const esCP = (s) => /^([A-Z]?\d{4}[A-Z]{0,3})$/i.test(s.trim());

  if (entregaRaw && entregaRaw.length >= 5) {
    direccion = entregaRaw;
    // Caso 1: aclaración entre paréntesis -> "CALLE NUM (LOCALIDAD)"
    // (puede venir además con un CP después: "... (LOCALIDAD), B1613")
    const conParentesis = direccion.match(/^(.*?)\s*\(([^)]{2,40})\)\s*(?:,\s*([A-Z]?\d{4}[A-Z]{0,3}))?\s*$/i);
    if (conParentesis) {
      direccion = conParentesis[1].trim();
      localidadEntrega = conParentesis[2].trim();
      if (conParentesis[3]) cpEntrega = conParentesis[3].trim();
    } else if (direccion.includes(',')) {
      // Caso 2: partes separadas por coma. Puede ser:
      //   "CALLE NUM, LOCALIDAD"           (2 partes)
      //   "CALLE NUM, LOCALIDAD, CP"       (3 partes) <- formato nuevo
      //   "CALLE NUM, CP"                  (2 partes, sin localidad)
      const partes = direccion.split(',').map(p => p.trim()).filter(Boolean);
      if (partes.length >= 3) {
        // La última parte, si parece CP, es el CP; la del medio, localidad
        direccion = partes[0];
        if (esCP(partes[partes.length - 1])) {
          cpEntrega = partes[partes.length - 1];
          localidadEntrega = partes.slice(1, -1).join(', ');
        } else {
          localidadEntrega = partes.slice(1).join(', ');
        }
      } else if (partes.length === 2) {
        direccion = partes[0];
        if (esCP(partes[1])) cpEntrega = partes[1];
        else localidadEntrega = partes[1];
      }
    }
    // Caso 3: sin comas ni paréntesis -> "CALLE NUM" solo; la localidad
    // de esta entrega se completa más abajo con la "Localidad:" general.
  } else {
    direccion = '';
  }

  // FALLBACK: si "Entrega:" viene vacío (pasa seguido), usar Domicilio
  // (Formato 1) o Direccion (Formato 2) — la localidad se completa más
  // abajo con la "Localidad:" general.
  if (!direccion || direccion.length < 5) {
    let dom = clean.match(/Domicilio\s*:\s*([A-Z0-9][A-Z0-9\s\.\-\/]{3,80}?)(?=\s*(?:IVA|CUIT|Localidad)\s*:)/i);
    if (!dom) {
      dom = clean.match(/Direccion\s*:\s*([A-Z0-9\u00C0-\u017F][A-Z0-9\u00C0-\u017F\s\.\-\/]{3,80}?)(?=\s*Localidad\s*:)/i);
    }
    if (dom) direccion = dom[1].trim();
  }

  // Si el PDF pegó un número con la palabra siguiente sin espacio
  // (ej. "1331GRAND BOURG" en vez de "1331 GRAND BOURG"), separarlos
  // para que la dirección geocodifique mejor.
  if (direccion) {
    direccion = direccion.replace(/(\d)([A-Z]{2,})/g, '$1 $2');
    // Prolijidad: pasar a "Title Case" (primera de cada palabra en
    // mayúscula, resto en minúscula) — no afecta la búsqueda, que ya
    // ignora mayúsculas/acentos.
    direccion = direccion.toLowerCase().replace(/\b\p{L}/gu, c => c.toUpperCase());
  }

  // LOCALIDAD GENERAL de la factura (domicilio del cliente) — se usa
  // como localidad de la entrega solo cuando el campo "Entrega" no trajo
  // su propia aclaración (casos 2 y 3 de arriba). Se prueban los cortes
  // de los dos formatos de boleta.
  let loc2 = clean.match(/Localidad\s*:\s*([A-Z\u00C0-\u017F\s]{2,40}?)(?=\s*(?:Zona|Vendedor|CUIT)\s*:)/i);
  if (!loc2) {
    loc2 = clean.match(/Localidad\s*:\s*([A-Z\u00C0-\u017F\s]{2,40}?)(?=\s*(?:Horario|Entrega|Vendedor)\s*:)/i);
  }
  const localidadGeneral = loc2 ? loc2[1].trim().replace(/C\s+A\s+B\s+A/gi,'CABA').substring(0,40) : '';
  localidad = (localidadEntrega || localidadGeneral).substring(0, 40);
  // Prolijidad: pasar a "Title Case" (no afecta la búsqueda en el mapa,
  // que ya ignora mayúsculas/acentos, es solo para mostrar).
  if (localidad) localidad = localidad.toLowerCase().replace(/\b\p{L}/gu, c => c.toUpperCase());

  // ZONA: la boleta trae la zona de reparto (1 a 6). Puede venir como
  // "Zona: 4", "Zona: zona 4" (Formato 1) o "zona 4" sin dos puntos
  // (Formato 2, después de "Vendedor :...").
  let zona = '';
  const zonaMatch = clean.match(/zona\s*:?\s*(?:zona\s*)?([0-9]{1,2})/i);
  if (zonaMatch) zona = zonaMatch[1].trim();

  // PESO TOTAL — dos formatos:
  // Formato 1 (Factura A): "Peso Total: 189.84 Bultos:" → punto=decimal, sin coma
  // Formato 2 (Cobranza):  "Peso Total : 1.610,00"      → punto=miles, coma=decimal
  // Se detecta el formato por la presencia de coma.
  const pw = clean.match(/Peso\s*Total\s*[:\s]+([\d.]+,\d+)\s*Bultos/i)
          || clean.match(/([\d.]+,\d+)\s*Bultos/i)
          || clean.match(/Peso\s*Total\s*[:\s]+([\d.]+,\d+)/i)
          || clean.match(/Peso\s*Total\s*[:\s]+(\d+\.\d+)\s*Bultos/i)
          || clean.match(/Peso\s*Total\s*[:\s]+(\d+\.\d+)/i)
          || clean.match(/Peso\s*Total\s*[:\s]+([0-9]+)\s*Bultos/i)
          || clean.match(/Peso\s*Total\s*[:\s]+([0-9]+)/i);
  if (pw) {
    const raw = pw[1];
    if (raw.includes(',')) {
      // Formato argentino: 1.610,00 → quitar puntos de miles, coma → punto
      peso = parseFloat(raw.replace(/\./g, '').replace(',', '.'));
    } else {
      // Formato internacional: 189.84 → parsear directo
      peso = parseFloat(raw);
    }
  }

  // NOTA: ya no se agrega ", Buenos Aires" genérico acá — la localidad
  // real (Derqui, Muñiz, Polvorines, etc.) ya se extrajo por separado
  // más arriba y viaja en el campo "localidad"; agregar "Buenos Aires"
  // sin la localidad puntual solo le restaba precisión a la búsqueda en
  // el mapa (y duplicaba el dato cuando el servidor arma la consulta).

  console.log('[TR Parser] Resultado:', { cliente, direccion, peso, zona, localidad, cp: cpEntrega });

  // GPS embebido en el PDF (coordenadas pre-calculadas)
  let lat = null, lon = null;
  const gpsMatch = clean.match(/GPS:\s*(-?\d+\.\d+),\s*(-?\d+\.\d+)/i);
  if (gpsMatch) { lat = parseFloat(gpsMatch[1]); lon = parseFloat(gpsMatch[2]); }

  if (!cliente || !direccion) {
    console.warn('[TR Parser] FALLO - texto disponible:', clean.substring(0,200));
    return [];
  }

  // NÚMERO DE BOLETA: "N° 0006-00002396". El PDF lo trae en trozos
  // separados (a veces sin guion y sin el "°"), por eso se toleran
  // espacios y guion opcional entre punto de venta (4) y número (8).
  let numero_boleta = '';
  const nb = clean.match(/\bN\s*[°º.]?\s*(\d{4})\s*-?\s*(\d{8})\b/i);
  if (nb) numero_boleta = `${nb[1]}-${nb[2]}`;
  // Formato 2 (cobranza / nota de pedido): "N°Cob : 00004672  A". El
  // símbolo "°" se borra al limpiar, así que queda "N Cob : 00004672".
  // La letra suelta del final (A) es el tipo de comprobante, no se guarda.
  if (!numero_boleta) {
    const nc = clean.match(/\bN\s*[°º.]?\s*Cob\s*:?\s*(\d{4,10})\b/i);
    if (nc) numero_boleta = nc[1];
  }

  return [{ cliente, numero_boleta, direccion, peso_kg: peso || 50, barrio: localidad, cp: cpEntrega, zona, notas: '', lat, lon }];
}

// "N° 0006-00002396" listo para mostrar junto al nombre del cliente.
function nroBoleta(b) {
  return b && b.numero_boleta ? `<span class="text-muted" style="font-weight:400;font-size:.85em">· N° ${escapeHtmlTracking(b.numero_boleta)}</span>` : '';
}

// Cantidad real de paradas: boletas de una misma dirección cuentan como una.
function cantParadas(boletas) {
  return agruparParadasHistorico(boletas || []).length;
}


async function geocodificarBoleta(boleta) {
  // La geocodificación corre del lado del servidor (Google Geocoding) —
  // acá solo se dispara y se interpreta el resultado. Devuelve 'exacta',
  // 'aproximada' o false (no se encontró).
  try {
    const r = await api('boletas.php', 'POST', { action: 'geocodificar', id: boleta.id });
    if (!r.success) { console.warn(`[TR Geo] ${boleta.cliente} (${boleta.direccion}): ${r.message}`); return false; }
    return r.aproximada ? 'aproximada' : 'exacta';
  } catch(e) {
    console.error('Geocoding error for', boleta.direccion, e);
    return false;
  }
}

async function geocodificarTodas() {
  const sinGeo = state.boletas.filter(b => !b.lat || !b.lon);
  if (sinGeo.length === 0) return;

  toast(`📍 Geolocalizando ${sinGeo.length} dirección${sinGeo.length>1?'es':''}...`);

  const fallidas = [];
  const aproximadas = [];
  for (const boleta of sinGeo) {
    let res = await geocodificarBoleta(boleta);
    if (!res) {
      // Un reintento por si hubo un error puntual de red.
      await new Promise(r => setTimeout(r, 400));
      res = await geocodificarBoleta(boleta);
    }
    if (!res) fallidas.push(`${boleta.cliente} (${boleta.direccion})`);
    else if (res === 'aproximada') aproximadas.push(boleta.cliente);
    await new Promise(r => setTimeout(r, 150)); // Google admite buen ritmo
  }

  await loadBoletas();
  if (fallidas.length) {
    toast(`⚠️ No se pudo ubicar ni siquiera aproximado: ${fallidas.join(' · ')}. Usá el botón 📍 de esa boleta para reintentar.`, 'error');
  } else if (aproximadas.length) {
    toast(`✅ Geocodificación completada. ⚠️ ${aproximadas.length} quedaron aproximadas (revisalas en el mapa): ${aproximadas.join(', ')}`);
  } else {
    toast('✅ Geocodificación completada, todas exactas.');
  }
}


// =============================================
// PAGE: VIAJES PENDIENTES (hoja de ruta por zona)
// =============================================
// Cada zona (1 a 6) tiene, como mucho, UN viaje "armado" (pendiente de
// confirmar) por día. Se arma solo con las boletas de esa zona y se va
// completando a medida que llegan boletas nuevas de la misma zona. El
// administrador elige qué camión sale para cada zona; hasta que no
// confirma, el viaje queda acá (no se borra) y las demás zonas también
// quedan disponibles para otro día.
function renderArmar() {
  return `
  <div class="page-header">
    <h1>🗺️ Viajes pendientes por zona</h1>
    <p>Una hoja de ruta por zona. Queda guardada acá, sumando boletas, hasta que confirmás qué camión sale — no importa cuántos días pasen.</p>
  </div>
  <div class="flex gap-3 mb-4" style="flex-wrap:wrap;align-items:center">
    <button class="btn btn-secondary btn-sm" id="armar-btn">↻ Actualizar viajes pendientes</button>
    <button class="btn btn-secondary btn-sm" id="pospuestas-todas-btn" title="Devuelve todas las boletas pospuestas a pendientes y se agrupan en el viaje de su zona">↩️ Pasar todas las pospuestas a pendientes</button>
  </div>
  <div id="viajes-preview"><div class="loading"><div class="spinner"></div> Cargando...</div></div>`;
}

function bindArmarPage() {
  document.getElementById('armar-btn')?.addEventListener('click', armarViajes);
  document.getElementById('pospuestas-todas-btn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    if (!confirm('¿Pasar TODAS las boletas pospuestas a pendientes? Se van a sumar al viaje de su zona.')) return;
    btn.disabled = true;
    const r = await api('viajes.php','POST',{action:'reactivar_todas_pospuestas'});
    btn.disabled = false;
    if (r.success) {
      toast(r.cantidad > 0 ? '✅ '+r.message : r.message);
      refreshPospuestasCount();
      if (r.cantidad > 0) armarViajes();
    } else toast(r.message||'Error','error');
  });
  armarViajes();
}

// =============================================
// PAGE: BOLETAS POSPUESTAS
// =============================================
// Boletas que se sacaron de un viaje armado (con "✕ Sacar") antes de
// confirmar. Tienen su propia página en el menú para que sean fáciles
// de encontrar, sin depender de estar parado en "Viajes pendientes".
function renderPospuestasPage() {
  return `
  <div class="page-header">
    <h1>📋 Boletas pospuestas</h1>
    <p>Se sacaron de un viaje antes de confirmar. Quedan acá hasta que las agregues a un viaje o las devuelvas a pendientes.</p>
  </div>
  <div id="pospuestas-page-content"><div class="loading"><div class="spinner"></div> Cargando...</div></div>`;
}

async function cargarPospuestasPage() {
  const cont = document.getElementById('pospuestas-page-content');
  if (!cont) return;

  const [rPosp, rArmados] = await Promise.all([
    api('boletas.php?pospuestas=1'),
    api('viajes.php','POST',{action:'armar',fecha:state.fechaSeleccionada}),
  ]);

  const viajesArmados = (rArmados.success && rArmados.viajes) ? rArmados.viajes : [];
  state.viajesArmadosCache = viajesArmados;

  if (!rPosp.success || !rPosp.boletas.length) {
    cont.innerHTML = '<div class="card"><p class="text-muted">No hay boletas pospuestas por ahora. Cuando saques alguna con el botón "✕ Sacar" en Viajes pendientes, va a aparecer acá.</p></div>';
    return;
  }

  cont.innerHTML = `<div style="display:grid;gap:10px">${rPosp.boletas.map(b => `
    <div class="card">
      <div class="flex gap-3" style="justify-content:space-between;flex-wrap:wrap;align-items:center">
        <div>
          <div style="font-weight:700">${b.cliente} ${nroBoleta(b)}</div>
          <div class="text-sm text-muted">${b.direccion} · Zona ${b.zona||'—'} · ${b.peso_kg} kg</div>
        </div>
        <div class="flex gap-2 items-center">
          <select class="pospuesta-agregar-sel" data-bid="${b.id}" style="width:180px" ${!viajesArmados.length?'disabled':''}>
            <option value="">${viajesArmados.length?'Agregar a un viaje...':'No hay viajes armados'}</option>
            ${viajesArmados.map(v=>`<option value="${v.id}">→ Zona ${v.zona}</option>`).join('')}
          </select>
          <button class="btn btn-secondary btn-sm pospuesta-reactivar-btn" data-bid="${b.id}" title="Vuelve a pendiente y se agrupa sola en su zona">↩️ A pendientes</button>
          <button class="btn btn-danger btn-sm pospuesta-eliminar-btn" data-bid="${b.id}" title="Eliminar definitivamente">🗑 Eliminar</button>
        </div>
      </div>
    </div>`).join('')}</div>`;

  document.querySelectorAll('.pospuesta-agregar-sel').forEach(sel => {
    sel.addEventListener('change', async () => {
      if (!sel.value) return;
      const r = await api('viajes.php','POST',{action:'agregar_pospuesta_a_viaje', boleta_id:parseInt(sel.dataset.bid), viaje_destino:parseInt(sel.value)});
      if (r.success) { toast('✅ '+r.message); await cargarPospuestasPage(); refreshPospuestasCount(); }
      else { toast(r.message||'No se pudo agregar','error'); sel.value=''; }
    });
  });
  document.querySelectorAll('.pospuesta-reactivar-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const r = await api('viajes.php','POST',{action:'reactivar_pospuesta', boleta_id:parseInt(btn.dataset.bid)});
      if (r.success) { toast('✅ '+r.message); await cargarPospuestasPage(); refreshPospuestasCount(); }
      else toast(r.message||'Error','error');
    });
  });
  document.querySelectorAll('.pospuesta-eliminar-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar esta boleta definitivamente? No se puede deshacer.')) return;
      const r = await api(`boletas.php?id=${btn.dataset.bid}`, 'DELETE');
      if (r.success) { toast('✅ Boleta eliminada'); await cargarPospuestasPage(); refreshPospuestasCount(); }
      else toast(r.message||'No se pudo eliminar','error');
    });
  });
}

async function armarViajes() {
  const btn = document.getElementById('armar-btn');
  if (btn) { btn.disabled = true; btn.textContent = '↻ Actualizando...'; }

  const r = await api('viajes.php','POST',{action:'armar',fecha:state.fechaSeleccionada});
  const repR = await api('repartidores.php');
  state.repartidores = repR.repartidores || [];
  state.camiones     = repR.camiones || [];
  const destR = await api('config_api.php','POST',{action:'listar_destinos'});
  state.destinos = (destR.success && destR.destinos) ? destR.destinos : [];
  const ocupR = await api('viajes.php?ocupacion=1');
  state.camionOcupacion = (ocupR.success && ocupR.ocupacion) ? ocupR.ocupacion : [];

  const preview = document.getElementById('viajes-preview');
  if (btn) { btn.disabled = false; btn.textContent = '↻ Actualizar viajes pendientes'; }

  if (!r.success) { toast(r.message||'Error','error'); return; }
  state.viajesArmadosCache = r.viajes || [];

  if (!r.viajes.length) {
    preview.innerHTML = `<div class="card"><p class="text-muted">No hay boletas pendientes. Cargá boletas en PDF desde "Boletas" — cada una arma o completa la hoja de ruta de su zona automáticamente.</p></div>`;
    return;
  }

  // Camiones que se pueden elegir: los disponibles y los que están en
  // viaje ahora (esos solo valen si el viaje sale otro día). Los que están
  // en mantenimiento no aparecen hasta que cambien de estado.
  const disponibles = state.camiones.filter(c => c.estado === 'disponible' || c.estado === 'en_viaje');
  const opcionCamion = c => `<option value="${c.id}" data-cap="${c.capacidad_kg}" data-estado="${c.estado}">🚛 ${c.patente}${c.marca?' — '+c.marca:''}${c.modelo?' '+c.modelo:''} (${c.capacidad_kg} kg)${c.estado==='en_viaje'?' · en viaje ahora':''}</option>`;
  const hoyISO = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  const colors = ['#2ecc71','#3B82F6','#F5C518','#E53E3E','#a855f7','#f97316'];
  // Color FIJO por número de zona: la Zona 1 siempre el mismo color, la
  // Zona 2 otro, etc. Así, al mover una boleta a otra zona, su punto en
  // el mapa adopta de inmediato el color y número de la zona destino, sin
  // depender del orden en que se listan los viajes. Las zonas no
  // numéricas ("Sin zona") caen a un gris.
  const colorDeZona = (zona) => {
    const n = parseInt(zona);
    if (!isNaN(n) && n >= 1) return colors[(n - 1) % colors.length];
    return '#9CA3AF';
  };

  preview.innerHTML = `
  <div class="flex gap-3 mb-4" style="align-items:center;justify-content:space-between;flex-wrap:wrap">
    <h2>Zonas pendientes de salir (${r.viajes.length})</h2>
    <button class="btn btn-secondary btn-sm" id="retiro-prov-btn">📦 Retiro de proveedor</button>
  </div>
  <p class="text-sm text-muted mb-4">Mirá el mapa para ver si dos zonas cercanas conviene mandarlas el mismo día con el mismo camión.</p>

  <div id="retiro-prov-modal" style="display:none" class="card mb-4" style="border-left:3px solid var(--azul)">
    <h3 class="mb-4" style="font-size:15px">📦 Agregar retiro de proveedor</h3>
    <p class="text-sm text-muted mb-4">El repartidor pasa a buscar un pedido en la dirección del proveedor antes o después de sus entregas. Se agrega como una parada al viaje que elijas.</p>
    <div class="form-row mb-4">
      <div class="form-group"><label>Nombre del pedido / proveedor</label><input type="text" id="rp-nombre" placeholder="Ej: Proveedor García" /></div>
      <div class="form-group"><label>Zona (viaje al que se suma)</label>
        <select id="rp-viaje">
          <option value="">Elegí un viaje...</option>
          ${r.viajes.map(v=>`<option value="${v.id}">Zona ${v.zona} (${cantParadas(v.boletas)} paradas · ${(v.boletas||[]).length} boletas)</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row mb-4">
      <div class="form-group"><label>Calle</label><input type="text" id="rp-calle" placeholder="Av. Rivadavia" /></div>
      <div class="form-group"><label>Altura</label><input type="text" id="rp-altura" placeholder="4500" /></div>
    </div>
    <div class="form-row mb-4">
      <div class="form-group"><label>Localidad</label><input type="text" id="rp-localidad" placeholder="San Miguel" /></div>
      <div class="form-group"><label>Código postal</label><input type="text" id="rp-cp" placeholder="B1663" /></div>
    </div>
    <div class="form-row mb-4">
      <div class="form-group"><label>Provincia</label><input type="text" id="rp-provincia" placeholder="Buenos Aires" value="Buenos Aires" /></div>
      <div class="form-group"><label>Peso aprox. (kg)</label><input type="number" id="rp-peso" placeholder="0" value="0" /></div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary btn-sm" id="rp-guardar-btn">Agregar parada</button>
      <button class="btn btn-secondary btn-sm" id="rp-cancelar-btn">Cancelar</button>
    </div>
    <p class="text-sm text-muted mt-2" id="rp-status"></p>
  </div>
  <div id="preview-map" style="height:320px;border-radius:12px;margin-bottom:20px;border:1px solid #2E2E2E"></div>
  ${r.viajes.length > 1 ? `
  <div class="card mb-4" id="bulk-bar" style="border-left:3px solid var(--verde)">
    <div class="flex gap-2 items-center" style="flex-wrap:wrap">
      <strong id="bulk-count" style="min-width:170px">0 zonas seleccionadas</strong>
      <select id="bulk-cam-sel" style="width:200px" ${!disponibles.length?'disabled':''}>
        <option value="">${disponibles.length?'Camión para las seleccionadas...':'No hay camiones disponibles'}</option>
        ${disponibles.map(opcionCamion).join('')}
      </select>
      <label class="text-sm text-muted">📅 Sale el:</label>
      <input type="date" id="bulk-dia" min="${hoyISO}" style="width:150px" title="Día de salida (vacío = hoy)" />
      <select id="bulk-rep-sel" style="width:180px">
        <option value="">Sin repartidor</option>
        ${state.repartidores.map(rep=>`<option value="${rep.id}">${rep.nombre}</option>`).join('')}
      </select>
      <select id="bulk-destino-sel" style="width:180px" title="Dónde termina el viaje">
        <option value="deposito">🏭 Depósito</option>
      </select>
      <button class="btn btn-primary btn-sm" id="bulk-confirmar-btn" disabled>✅ Confirmar zonas seleccionadas</button>
    </div>
    <div class="text-sm mt-2" id="bulk-cap-alerta"></div>
    <p class="text-sm text-muted mt-2">Tildá 2 o más zonas para mandarlas el mismo día con un solo camión (ej. zonas vecinas). Se van a unificar en un solo viaje.</p>
  </div>` : ''}
  ${r.viajes.map((v,i) => {
    const color = colorDeZona(v.zona);
    const pct = disponibles.length ? null : null;
    return `
    <div class="viaje-card mb-4" id="viaje-card-${v.id}">
      <div class="viaje-header">
        <div class="flex gap-2" style="align-items:flex-start">
          ${r.viajes.length > 1 ? `<input type="checkbox" class="zona-check" data-vid="${v.id}" data-peso="${parseFloat(v.peso_total)||0}" style="width:20px;height:20px;margin-top:4px" />` : ''}
          <div>
            <h3><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${color};margin-right:6px"></span>🗺️ Zona ${v.zona}</h3>
            <div class="text-sm text-muted mt-2">${cantParadas(v.boletas)} paradas · ${(v.boletas||[]).length} boletas · ${parseFloat(v.peso_total).toFixed(0)} kg</div>
          </div>
        </div>
        <div class="flex gap-2 items-center" style="flex-wrap:wrap">
          <label class="text-sm text-muted">📅 Sale el:</label>
          <input type="date" class="dia-salida-input" data-vid="${v.id}" min="${hoyISO}" value="${v.dia_salida && v.dia_salida >= hoyISO ? v.dia_salida : ''}" style="width:150px" title="Día de salida (vacío = hoy)" />
          <select id="cam-sel-${v.id}" style="width:200px" ${!disponibles.length?'disabled':''}>
            <option value="">${disponibles.length?'Elegí un camión...':'No hay camiones disponibles'}</option>
            ${disponibles.map(opcionCamion).join('')}
          </select>
          <select id="rep-sel-${v.id}" style="width:180px">
            <option value="">Sin repartidor</option>
            ${state.repartidores.map(rep=>`<option value="${rep.id}">${rep.nombre}</option>`).join('')}
          </select>
          <select id="destino-sel-${v.id}" style="width:180px" title="Dónde termina el viaje">
            <option value="deposito">🏭 Depósito</option>
          </select>
          <button class="btn btn-primary btn-sm" id="confirmar-btn-${v.id}">✅ Confirmar salida</button>
          <button class="btn btn-danger btn-sm" id="eliminar-armado-btn-${v.id}" title="Borrar este viaje y sus boletas">🗑 Eliminar viaje</button>
        </div>
      </div>
      <div class="text-sm mt-2" id="cap-alerta-${v.id}"></div>
      <div class="viaje-body">
        ${(v.boletas||[]).map((b,j) => `
        <div class="parada-row">
          <div class="parada-num">${j+1}</div>
          <div class="parada-info">
            <div class="parada-cliente">${b.cliente} ${nroBoleta(b)}</div>
            <div class="parada-dir">${b.direccion} <span class="text-muted">· Zona ${b.zona||'—'}</span></div>
            <div class="parada-peso">${b.peso_kg} kg</div>
          </div>
          <div class="flex gap-2 items-center">
            ${r.viajes.length > 1 ? `
            <select class="mover-boleta-sel" data-bid="${b.id}" style="width:150px;font-size:12px" title="Mover a otro viaje">
              <option value="">Mover a...</option>
              ${r.viajes.filter(x=>x.id!==v.id).map(x=>`<option value="${x.id}">→ Zona ${x.zona}</option>`).join('')}
            </select>` : ''}
            <button class="btn btn-secondary btn-sm sacar-parada-btn" data-bid="${b.id}" title="Sacar del viaje y dejar en pospuestas">Posponer</button>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}`;

  setTimeout(async () => {
    await cargarGoogleMaps();
    const map = new google.maps.Map(document.getElementById('preview-map'), {
      center: { lat: FABRICA.lat, lng: FABRICA.lon }, zoom: 11, mapTypeControl: false, streetViewControl: false,
    });
    new google.maps.Marker({
      position: { lat: FABRICA.lat, lng: FABRICA.lon }, map,
      label: { text: '🏭', fontSize: '18px' }, title: 'Punto de partida',
    });
    r.viajes.forEach((v) => {
      const color = colorDeZona(v.zona);
      (v.boletas||[]).forEach((b) => {
        if (!b.lat||!b.lon) return;
        const marker = new google.maps.Marker({
          position: { lat: parseFloat(b.lat), lng: parseFloat(b.lon) }, map,
          label: { text: String(v.zona), color: '#fff', fontWeight: '700' },
          icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, scale: 14 },
        });
        const info = new google.maps.InfoWindow({ content: `<div style="color:#1a1a1a;font-size:13px"><strong>Zona ${v.zona} · ${b.cliente}</strong><br>${b.direccion}</div>` });
        marker.addListener('click', () => info.open(map, marker));
      });
    });
  }, 200);

  r.viajes.forEach(v => {
    const sel = document.getElementById(`cam-sel-${v.id}`);
    sel?.addEventListener('change', () => {
      const opt = sel.selectedOptions[0];
      const alerta = document.getElementById(`cap-alerta-${v.id}`);
      if (!opt || !opt.value) { alerta.innerHTML=''; return; }
      const cap = parseFloat(opt.dataset.cap||0);
      const pct = cap ? (parseFloat(v.peso_total)/cap)*100 : 0;
      if (pct > 100) alerta.innerHTML = `⚠️ <strong>Sobrecargado</strong> (${pct.toFixed(0)}% de la capacidad)`;
      else if (pct < 30) alerta.innerHTML = `ℹ️ Camión subutilizado (${pct.toFixed(0)}% de la capacidad)`;
      else alerta.innerHTML = `✅ Carga adecuada (${pct.toFixed(0)}% de la capacidad)`;
    });
    document.getElementById(`confirmar-btn-${v.id}`)?.addEventListener('click', () => confirmarViaje(v.id));
    document.getElementById(`eliminar-armado-btn-${v.id}`)?.addEventListener('click', () => eliminarViajeArmado(v.id, v.zona));
    // Actualizar la opción "Casa de [repartidor]" cuando cambia el rep
    document.getElementById(`rep-sel-${v.id}`)?.addEventListener('change', () => actualizarDestinoOpciones(v.id));
    // Llamar ahora para mostrar la casa si ya hay un repartidor preseleccionado
    actualizarDestinoOpciones(v.id);
  });

  // Camiones que se pueden elegir para un día dado: nunca los que están en
  // mantenimiento ni los que ya tienen un viaje ese día (uno por día). Para
  // hoy solo los disponibles; para un día posterior también los que están
  // en viaje ahora.
  function camionesParaDia(dia) {
    const d = dia || hoyISO;
    const ocupados = new Set((state.camionOcupacion || []).filter(o => String(o.fecha).slice(0,10) === d).map(o => String(o.camion_id)));
    return state.camiones.filter(c =>
      !ocupados.has(String(c.id)) &&
      (c.estado === 'disponible' || (c.estado === 'en_viaje' && d > hoyISO)));
  }
  function refrescarCamionesSelect(selectId, dia) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const lista = camionesParaDia(dia);
    const previo = sel.value;
    sel.innerHTML = `<option value="">${lista.length ? 'Elegí un camión...' : 'No hay camiones disponibles ese día'}</option>` + lista.map(opcionCamion).join('');
    sel.disabled = !lista.length;
    sel.value = lista.some(c => String(c.id) === previo) ? previo : '';
    sel.dispatchEvent(new Event('change'));
  }
  document.querySelectorAll('.dia-salida-input').forEach(inp => {
    const selId = `cam-sel-${inp.dataset.vid}`;
    refrescarCamionesSelect(selId, inp.value);
    inp.addEventListener('change', () => refrescarCamionesSelect(selId, inp.value));
  });
  const bulkDiaInp = document.getElementById('bulk-dia');
  if (bulkDiaInp) {
    refrescarCamionesSelect('bulk-cam-sel', bulkDiaInp.value);
    bulkDiaInp.addEventListener('change', () => refrescarCamionesSelect('bulk-cam-sel', bulkDiaInp.value));
  }

  // Guardar día de salida planeado de cada zona (solo planificación admin)
  document.querySelectorAll('.dia-salida-input').forEach(inp => {
    inp.addEventListener('change', async () => {
      const r = await api('viajes.php','POST',{action:'dia_salida', viaje_id:parseInt(inp.dataset.vid), dia_salida:inp.value});
      toast(r.success ? '📅 Día de salida guardado' : (r.message||'Error'), r.success?undefined:'error');
    });
  });

  // Mover una boleta suelta al viaje de otra zona (para aprovechar
  // cercanía y ahorrar un recorrido).
  document.querySelectorAll('.mover-boleta-sel').forEach(sel => {
    sel.addEventListener('change', async () => {
      if (!sel.value) return;
      const r = await api('viajes.php','POST',{action:'mover_boleta', boleta_id:parseInt(sel.dataset.bid), viaje_destino:parseInt(sel.value)});
      if (r.success) { toast('✅ '+r.message); await armarViajes(); }
      else { toast(r.message||'No se pudo mover','error'); sel.value=''; }
    });
  });

  // Sacar una boleta del viaje (antes de confirmar): vuelve a pendiente
  // para reasignarla otro día. Ej: el cliente avisó que ese día no recibe.
  document.querySelectorAll('.sacar-parada-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('¿Sacar esta boleta del viaje? Queda guardada en "Boletas pospuestas" hasta que la agregues a otro viaje.')) return;
      const r = await api('viajes.php','POST',{action:'quitar_parada', boleta_id:parseInt(btn.dataset.bid)});
      if (r.success) { toast('✅ '+r.message); await armarViajes(); refreshPospuestasCount(); }
      else toast(r.message||'Error','error');
    });
  });

  // Selección múltiple: tildar 2+ zonas para confirmarlas juntas con un
  // mismo camión (útil cuando dos zonas quedan cerca en el mapa).
  const bulkBtn = document.getElementById('bulk-confirmar-btn');
  const bulkCount = document.getElementById('bulk-count');
  const bulkCamSel = document.getElementById('bulk-cam-sel');
  function actualizarBulk() {
    const marcados = Array.from(document.querySelectorAll('.zona-check:checked'));
    if (bulkCount) bulkCount.textContent = `${marcados.length} zona${marcados.length===1?'':'s'} seleccionada${marcados.length===1?'':'s'}`;
    if (bulkBtn) bulkBtn.disabled = marcados.length < 2 || !bulkCamSel?.value;
    const alerta = document.getElementById('bulk-cap-alerta');
    if (!alerta) return;
    const opt = bulkCamSel?.selectedOptions[0];
    if (marcados.length < 2 || !opt?.value) { alerta.innerHTML=''; return; }
    const pesoTotal = marcados.reduce((s,chk) => s + (parseFloat(chk.dataset.peso) || 0), 0);
    const cap = parseFloat(opt.dataset.cap||0);
    const pct = cap ? (pesoTotal/cap)*100 : 0;
    alerta.innerHTML = pct > 100
      ? `⚠️ <strong>Sobrecargado</strong>: ${pesoTotal.toFixed(0)} kg de las zonas juntas vs ${cap} kg de capacidad (${pct.toFixed(0)}%)`
      : `✅ ${pesoTotal.toFixed(0)} kg de las zonas juntas — ${pct.toFixed(0)}% de la capacidad del camión`;
  }
  document.querySelectorAll('.zona-check').forEach(chk => chk.addEventListener('change', actualizarBulk));
  bulkCamSel?.addEventListener('change', actualizarBulk);
  // Casa del repartidor como punto de finalización, igual que en una zona sola.
  const bulkRepSel = document.getElementById('bulk-rep-sel');
  const bulkDestSel = document.getElementById('bulk-destino-sel');
  bulkRepSel?.addEventListener('change', () => actualizarDestinoOpcionesEls(bulkRepSel, bulkDestSel));
  actualizarDestinoOpcionesEls(bulkRepSel, bulkDestSel);
  bulkBtn?.addEventListener('click', () => {
    const ids = Array.from(document.querySelectorAll('.zona-check:checked')).map(chk => parseInt(chk.dataset.vid));
    confirmarVariasJuntas(ids);
  });

  // Retiro de proveedor
  document.getElementById('retiro-prov-btn')?.addEventListener('click', () => {
    const m = document.getElementById('retiro-prov-modal');
    if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('rp-cancelar-btn')?.addEventListener('click', () => {
    const m = document.getElementById('retiro-prov-modal');
    if (m) m.style.display = 'none';
  });
  document.getElementById('rp-guardar-btn')?.addEventListener('click', agregarRetiroProveedor);
}

async function confirmarVariasJuntas(viajeIds) {
  const camion_id = parseInt(document.getElementById('bulk-cam-sel')?.value || 0) || null;
  const repartidor_id = parseInt(document.getElementById('bulk-rep-sel')?.value || 0) || null;
  const destino_tipo = document.getElementById('bulk-destino-sel')?.value || null;
  const dia_salida = document.getElementById('bulk-dia')?.value || '';
  if (!camion_id) { toast('Elegí el camión para las zonas seleccionadas', 'error'); return; }
  if (!validarCamionEnViaje('bulk-cam-sel', dia_salida)) return;

  const asignaciones = viajeIds.map(viaje_id => ({viaje_id, camion_id, repartidor_id, destino_tipo: destino_tipo || null, dia_salida: dia_salida || null}));
  const r = await api('viajes.php','POST',{action:'confirmar',fecha:state.fechaSeleccionada,asignaciones});
  if (r.success) {
    toast(`✅ ${viajeIds.length} zonas unificadas en un solo viaje con el mismo camión.`);
    await armarViajes();
  } else {
    toast(r.message||'No se pudo confirmar','error');
  }
}

function actualizarDestinoOpciones(viajeId) {
  actualizarDestinoOpcionesEls(
    document.getElementById(`rep-sel-${viajeId}`),
    document.getElementById(`destino-sel-${viajeId}`));
}

// Arma las opciones de "dónde termina el viaje": el depósito, y la casa
// del repartidor elegido si la tiene cargada.
function actualizarDestinoOpcionesEls(repSel, destSel) {
  if (!repSel || !destSel) return;
  const repId = parseInt(repSel.value || 0) || null;
  const rep = repId ? (state.repartidores || []).find(r => String(r.id) === String(repId)) : null;
  const tieneHome = rep && rep.dest_lat;
  const actual = destSel.value;
  destSel.innerHTML = `
    <option value="deposito">🏭 Depósito</option>
    ${tieneHome ? `<option value="repartidor">🏠 Casa de ${rep.nombre}</option>` : ''}
  `;
  // Restaurar selección previa si sigue siendo válida
  if (actual && destSel.querySelector(`option[value="${actual}"]`)) destSel.value = actual;
  else destSel.value = 'deposito';
}

async function agregarRetiroProveedor() {
  const nombre = document.getElementById('rp-nombre')?.value.trim();
  const viajeId = parseInt(document.getElementById('rp-viaje')?.value || 0) || null;
  const calle = document.getElementById('rp-calle')?.value.trim();
  const altura = document.getElementById('rp-altura')?.value.trim();
  const localidad = document.getElementById('rp-localidad')?.value.trim();
  const cp = document.getElementById('rp-cp')?.value.trim();
  const provincia = document.getElementById('rp-provincia')?.value.trim();
  const peso = parseFloat(document.getElementById('rp-peso')?.value || 0) || 0;
  const status = document.getElementById('rp-status');

  if (!nombre) { toast('Escribí el nombre del pedido o proveedor', 'error'); return; }
  if (!viajeId) { toast('Elegí a qué viaje se suma la parada', 'error'); return; }
  if (!calle || !localidad) { toast('Completá la calle y localidad del proveedor', 'error'); return; }

  const direccion = `${calle} ${altura}`.trim();
  const btn = document.getElementById('rp-guardar-btn');
  btn.disabled = true;
  if (status) status.textContent = '⏳ Creando boleta...';

  // 1) Crear la boleta como retiro
  const crearR = await api('boletas.php', 'POST', {
    action: 'crear',
    cliente: `RETIRO: ${nombre}`,
    direccion, barrio: localidad, cp, zona: '',
    peso_kg: peso,
    fecha: state.fechaSeleccionada,
    notas: `Retiro de proveedor. ${provincia ? 'Provincia: '+provincia : ''}`.trim(),
  });
  if (!crearR.success) {
    toast(crearR.message || 'No se pudo crear la boleta', 'error');
    btn.disabled = false;
    if (status) status.textContent = '';
    return;
  }
  const boletaId = crearR.id;

  // 2) Geocodificar
  if (status) status.textContent = '📍 Geolocalizando...';
  const geoR = await api('boletas.php', 'POST', { action: 'geocodificar', id: boletaId });
  if (!geoR.success) toast('⚠️ No se pudo geolocalizar la dirección — revisá en Boletas', 'error');

  // 3) Mover al viaje elegido
  if (status) status.textContent = '🔗 Asignando al viaje...';
  const moverR = await api('viajes.php', 'POST', { action: 'mover_boleta', boleta_id: boletaId, viaje_destino: viajeId });
  if (!moverR.success) {
    toast(moverR.message || 'No se pudo asignar al viaje', 'error');
    btn.disabled = false;
    if (status) status.textContent = '';
    return;
  }

  toast(`✅ Retiro "${nombre}" agregado al viaje`);
  document.getElementById('retiro-prov-modal').style.display = 'none';
  btn.disabled = false;
  if (status) status.textContent = '';
  // Limpiar campos
  ['rp-nombre','rp-calle','rp-altura','rp-localidad','rp-cp'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = id === 'rp-peso' ? '0' : '';
  });
  await armarViajes();
}

async function eliminarViajeArmado(viaje_id, zona) {
  if (!confirm(`¿Eliminar el viaje pendiente de la Zona ${zona}? Se van a borrar también sus boletas — si hacen falta, hay que volver a cargarlas.`)) return;
  const r = await api('viajes.php','POST',{action:'eliminar_armado',viaje_id:parseInt(viaje_id)});
  if (r.success) { toast('✅ '+r.message); await armarViajes(); }
  else toast(r.message||'Error','error');
}

// Un camión que está en viaje ahora solo se puede asignar a un viaje que
// sale otro día (posterior a hoy).
function validarCamionEnViaje(selectId, dia_salida) {
  const opt = document.getElementById(selectId)?.selectedOptions[0];
  if (opt?.dataset.estado !== 'en_viaje') return true;
  const hoy = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  if (dia_salida && dia_salida > hoy) return true;
  toast('Ese camión está en viaje ahora: elegí un día de salida posterior a hoy o usá otro camión', 'error');
  return false;
}

async function confirmarViaje(viaje_id) {
  const camion_id = parseInt(document.getElementById(`cam-sel-${viaje_id}`)?.value || 0) || null;
  const repartidor_id = parseInt(document.getElementById(`rep-sel-${viaje_id}`)?.value || 0) || null;
  const destino_tipo = document.getElementById(`destino-sel-${viaje_id}`)?.value || null;
  const dia_salida = document.querySelector(`.dia-salida-input[data-vid="${viaje_id}"]`)?.value || '';
  if (!camion_id) { toast('Elegí el camión que va a salir para esta zona', 'error'); return; }
  if (!validarCamionEnViaje(`cam-sel-${viaje_id}`, dia_salida)) return;

  const r = await api('viajes.php','POST',{action:'confirmar',fecha:state.fechaSeleccionada,asignaciones:[{viaje_id,camion_id,repartidor_id,destino_tipo:destino_tipo||null,dia_salida:dia_salida||null}]});
  if (r.success) {
    toast('✅ Viaje confirmado. El camión ya figura "en viaje".');
    await armarViajes();
  } else {
    toast(r.message||'No se pudo confirmar','error');
  }
}

// Une las boletas de una misma dirección (mismas coordenadas ~20 m, o el
// mismo texto de dirección) en una sola parada. Las paradas se ordenan por
// la primera hora de entrega real; las que no tienen hora van al final en
// el orden original.
function agruparParadasHistorico(boletas) {
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  const T = 0.0002;
  const grupos = [];
  boletas.forEach(b => {
    const lat = parseFloat(b.lat), lon = parseFloat(b.lon);
    const tieneCoords = !isNaN(lat) && !isNaN(lon);
    const dir = norm(b.direccion);
    const g = grupos.find(g =>
      (tieneCoords && g.tieneCoords && Math.abs(g.lat - lat) < T && Math.abs(g.lon - lon) < T) ||
      (dir && g.dir === dir));
    if (g) g.boletas.push(b);
    else grupos.push({ lat, lon, tieneCoords, dir, boletas: [b] });
  });
  grupos.forEach(g => {
    const ts = g.boletas.map(b => b.entregada_at ? new Date(String(b.entregada_at).replace(' ', 'T')).getTime() : NaN).filter(t => !isNaN(t));
    g.t = ts.length ? Math.min(...ts) : Infinity;
    g.boletas.sort((a, b) => String(a.entregada_at || '').localeCompare(String(b.entregada_at || '')));
  });
  return grupos.map((g, i) => ({ g, i })).sort((a, b) => (a.g.t === b.g.t ? a.i - b.i : a.g.t - b.g.t)).map(x => x.g);
}

async function eliminarDeHistorico(viaje_id) {
  if (!confirm('¿Eliminar este viaje del histórico? Si está confirmado o en curso, el camión queda disponible de nuevo y las boletas no entregadas vuelven a quedar pendientes.')) return;
  const r = await api('viajes.php','POST',{action:'cancelar',viaje_id:parseInt(viaje_id)});
  if (r.success) { toast('✅ Viaje eliminado'); loadHistorico(); }
  else toast(r.message||'Error','error');
}

function renderTracking() {
  return `
  <div class="page-header">
    <h1>📡 Tracking en tiempo real</h1>
    <p>Ubicación de los camiones en ruta ahora mismo.</p>

  <div id="tracking-lista"></div>`;

let trackingMapObj = null, trackingInterval = null;

async function loadTracking() {
  await cargarGoogleMaps();
  trackingMapObj = new google.maps.Map(document.getElementById('tracking-map'), {
    center: { lat: -34.60, lng: -58.45 }, zoom: 11, streetViewControl: false,
  });
  trackingMarkers = {};
  trackingParadaMarkers = {};
  trackingDestinoMarkers = {};
  trackingPolylines = {};
  trackingYaEncuadrado = false;

  new google.maps.Marker({
    position: { lat: FABRICA.lat, lng: FABRICA.lon }, map: trackingMapObj,
    label: { text: '🏭', fontSize: '14px' },
    title: 'Fábrica Tres Reyes',
  });

  await refreshTracking();

  // Auto-refresh cada 10 segundos
  if (trackingInterval) clearInterval(trackingInterval);
  trackingInterval = setInterval(async () => {
    if (state.page === 'tracking') await refreshTracking();
    else clearInterval(trackingInterval);
  }, 10000);
}

let trackingMarkers = {};
let trackingParadaMarkers = {}; // un marcador PIN por CADA parada pendiente (clave: id de boleta)
let trackingDestinoMarkers = {}; // marcador del PUNTO DE FINALIZACIÓN de cada viaje (clave: viaje_id)
let trackingPolylines = {}; // polilínea de ruta por viaje (clave: viaje_id)

// Icono circular (estilo viajes pendientes) para las paradas: círculo
// relleno con número blanco, igual que el mapa de viajes pendientes.
function iconoCirculo(color, texto) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    fillColor: color, fillOpacity: 1,
    strokeColor: '#fff', strokeWeight: 2,
    scale: 14,
  };
}

// Icono del camión: círculo más grande con borde más grueso.
function crearIconoCamion(color) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    fillColor: color, fillOpacity: 1,
    strokeColor: '#fff', strokeWeight: 3,
    scale: 18,
  };
}

// Icono para la fábrica y el destino: círculo gris pequeño con emoji como label.
function crearIconoPin(color, texto, escala) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    fillColor: color, fillOpacity: 1,
    strokeColor: '#fff', strokeWeight: 2,
    scale: 13 * (escala || 1),
  };
}

let trackingParadasVivas = new Set();
let trackingYaEncuadrado = false;

function escapeHtmlTracking(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ajusta el zoom una sola vez para que entren camión, paradas y destino.
function encuadrarTracking(positions) {
  const bounds = new google.maps.LatLngBounds();
  let n = 0;
  bounds.extend({ lat: FABRICA.lat, lng: FABRICA.lon });
  positions.forEach(p => {
    if (p.lat !== null) { bounds.extend({ lat: parseFloat(p.lat), lng: parseFloat(p.lon) }); n++; }
    (p.paradas || []).forEach(b => { if (b.lat && b.lon) { bounds.extend({ lat: parseFloat(b.lat), lng: parseFloat(b.lon) }); n++; } });
    if (p.destino_lat && p.destino_lon) { bounds.extend({ lat: parseFloat(p.destino_lat), lng: parseFloat(p.destino_lon) }); n++; }
  });
  if (n > 0) { trackingMapObj.fitBounds(bounds, 60); trackingYaEncuadrado = true; }
}

// Dibuja la ruta del viaje con el trazado por calles que el servidor
// calculó UNA vez al confirmar el viaje (mismo pedido a Google que
// optimiza el orden de las paradas), así el tracking no consulta a
// Google. Si el viaje no tiene trazado guardado (viajes anteriores o
// con una sola parada), se dibuja una línea recta entre los puntos.
// La línea se muestra SOLO desde donde está el camión hacia adelante (se
// recorta el trazado guardado en el punto más cercano al camión, sin
// consultar a Google). Si el camión se salió del trazado (más de 1,5 km),
// se pide UN recálculo desde su posición actual, como máximo cada 5 min.
const trackingRecalcAt = {};
function quitarRutaTracking(vid) {
  const m = trackingPolylines[vid];
  if (!m) return;
  m.line.setMap(null);
  delete trackingPolylines[vid];
}
function actualizarRutaTracking(vid, color, polyline, camion, pendientes, destino) {
  const prev = trackingPolylines[vid];
  let sig, base;
  if (polyline) {
    sig = 'poly:' + polyline.length + ':' + polyline.slice(0, 40);
    base = (prev && prev.sig === sig) ? prev.base : decodificarPolyline(polyline);
  } else {
    const origen = camion || { lat: FABRICA.lat, lng: FABRICA.lon };
    const pts = [origen, ...pendientes.map(g => ({ lat: g.lat, lng: g.lon })), ...(destino ? [destino] : [])];
    if (pts.length < 2) {
      quitarRutaTracking(vid);
      return;
    }
    sig = 'rect:' + pts.slice(1).map(q => q.lat.toFixed(5) + ',' + q.lng.toFixed(5)).join('|');
    base = pts;
  }

  let path = base, idx = (prev && prev.sig === sig) ? prev.idx : 0;
  if (polyline && camion) {
    // Si ya veníamos siguiendo este trazado, solo se mira unos km por
    // delante del último punto: así una ruta que vuelve por la misma calle
    // no hace saltar la línea al tramo de regreso.
    const ventana = (prev && prev.sig === sig) ? 6 : Infinity;
    let best = idx, bestD = Infinity, recorrido = 0;
    for (let j = idx; j < base.length; j++) {
      if (j > idx) recorrido += haversineJS(base[j - 1].lat, base[j - 1].lng, base[j].lat, base[j].lng);
      if (recorrido > ventana) break;
      const d = haversineJS(camion.lat, camion.lng, base[j].lat, base[j].lng);
      if (d < bestD) { bestD = d; best = j; }
    }
    idx = best;
    path = [camion, ...base.slice(idx)];
    if (bestD > 1.5 && Date.now() - (trackingRecalcAt[vid] || 0) > 300000) {
      trackingRecalcAt[vid] = Date.now();
      api('tracking.php', 'POST', { action: 'recalcular_ruta', viaje_id: parseInt(vid) })
        .then(r => { if (r && r.success && state.page === 'tracking') refreshTracking(); }).catch(() => {});
    }
  }

  const line = prev ? prev.line : new google.maps.Polyline({
    map: trackingMapObj, strokeColor: color, strokeOpacity: 0.85, strokeWeight: 5, zIndex: 10,
  });
  line.setPath(path);
  trackingPolylines[vid] = { line, sig, base, idx };
}
// Decodifica el formato "encoded polyline" de Google (precisión 1e5).
function decodificarPolyline(str) {
  const out = [];
  let i = 0, lat = 0, lng = 0;
  while (i < str.length) {
    for (const eje of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (eje === 0) lat += d; else lng += d;
    }
    out.push({ lat: lat / 1e5, lng: lng / 1e5 });
  }
  return out;
}

async function refreshTracking() {
  const r = await api('tracking.php?action=live');
  const lista = document.getElementById('tracking-lista');
  if (!r.success) return;
  trackingParadasVivas = new Set();

  if (!r.positions.length) {
    Object.values(trackingMarkers).forEach(m => m.marker.setMap(null));
    Object.values(trackingDestinoMarkers).forEach(m => m.marker.setMap(null));
    Object.values(trackingParadaMarkers).forEach(m => m.marker.setMap(null));
    Object.values(trackingPolylines).forEach(m => { m.line.setMap(null); if (m.conn) m.conn.setMap(null); });
    trackingMarkers = {}; trackingDestinoMarkers = {}; trackingParadaMarkers = {}; trackingPolylines = {};
    if (lista) lista.innerHTML = '<div class="card"><p class="text-muted">No hay camiones en ruta ahora mismo.</p></div>';
    return;
  }

  const colors = ['#1B7340','#3B82F6','#E53E3E','#F5C518'];

  r.positions.forEach((p, i) => {
    const lat = p.lat !== null ? parseFloat(p.lat) : null;
    const lon = p.lon !== null ? parseFloat(p.lon) : null;
    const color = colors[i % colors.length];
    const gpsInfo = lat !== null
      ? `±${Math.round(p.accuracy||0)}m · ${new Date(p.timestamp).toLocaleTimeString('es-AR')}`
      : '📡 Esperando señal GPS...';
    const popup = `<div style="color:#1a1a1a;font-size:13px"><strong>🚛 ${p.patente||'Sin patente'}</strong><br>👤 ${p.repartidor}<br>📍 ${p.zona}<br>✅ ${agruparParadasTracking(p.paradas).filter(g=>g.hecha).length}/${agruparParadasTracking(p.paradas).length} entregas<br><small>${gpsInfo}</small></div>`;

    if (lat !== null) {
      if (trackingMarkers[p.viaje_id]) {
        trackingMarkers[p.viaje_id].marker.setPosition({ lat, lng: lon });
      } else {
        const marker = new google.maps.Marker({
          position: { lat, lng: lon }, map: trackingMapObj,
          icon: crearIconoCamion(color),
          label: { text: '🚛', fontSize: '16px' },
          zIndex: 999, title: `${p.patente||''} — ${p.repartidor}`,
        });
        trackingMarkers[p.viaje_id] = { marker };
      }
    }

    // Paradas del viaje: las boletas de una misma dirección (coordenadas
    // dentro de ~20m) se unifican en UNA sola parada numerada, igual que
    // al armar la ruta. Se numeran sobre todas las paradas (entregadas o
    // no) para que el número coincida con la línea de progreso.
    const grupos = [];
    const TOLERANCIA = 0.0002;
    (p.paradas || []).filter(b => b.lat && b.lon).forEach(b => {
      const glat = parseFloat(b.lat), glon = parseFloat(b.lon);
      const g = grupos.find(g => Math.abs(g.lat - glat) < TOLERANCIA && Math.abs(g.lon - glon) < TOLERANCIA);
      if (g) g.boletas.push(b);
      else grupos.push({ lat: glat, lon: glon, boletas: [b] });
    });
    grupos.forEach((g, idx) => {
      g.hecha = g.boletas.every(b => b.estado === 'entregada');
      const repId = `grp-${p.viaje_id}-${idx}`;
      trackingParadasVivas.add(repId);
      const numLabel = String(idx + 1);
      const clientesList = g.boletas.map(b => escapeHtmlTracking(b.cliente) + (b.numero_boleta ? ' · N° ' + escapeHtmlTracking(b.numero_boleta) : '')).join('<br>');
      const cant = g.boletas.length > 1 ? ` <small>(${g.boletas.length} boletas)</small>` : '';
      const estadoTxt = g.hecha ? '✅ Entregada' : `⏳ Pendiente (${g.boletas.filter(b => b.estado !== 'entregada').length}/${g.boletas.length})`;
      const infoParada = `<div style="color:#1a1a1a;font-size:13px"><strong>Parada ${numLabel}${cant}</strong><br>${clientesList}<br>${escapeHtmlTracking(g.boletas[0].direccion)}<br><small>${estadoTxt} · Camión ${escapeHtmlTracking(p.patente)}</small></div>`;
      const icono = iconoCirculo(g.hecha ? '#94a3b8' : color, numLabel);
      const label = { text: g.hecha ? '✓' : numLabel, color: '#fff', fontWeight: '700', fontSize: '12px' };
      try {
        if (trackingParadaMarkers[repId]) {
          trackingParadaMarkers[repId].marker.setPosition({ lat: g.lat, lng: g.lon });
          trackingParadaMarkers[repId].marker.setIcon(icono);
          trackingParadaMarkers[repId].marker.setLabel(label);
          trackingParadaMarkers[repId].info.setContent(infoParada);
        } else {
          const paradaMarker = new google.maps.Marker({
            position: { lat: g.lat, lng: g.lon }, map: trackingMapObj,
            icon: icono, label, zIndex: 100 + idx,
            title: `${numLabel}. ${g.boletas.map(b=>b.cliente).join(', ')}`,
          });
          const infoP = new google.maps.InfoWindow({ content: infoParada });
          paradaMarker.addListener('click', () => infoP.open(trackingMapObj, paradaMarker));
          trackingParadaMarkers[repId] = { marker: paradaMarker, info: infoP };
        }
      } catch (e) {
        console.error('[TR Tracking] Error dibujando grupo', repId, e);
      }
    });

    // Ruta que le falta recorrer: camión (o fábrica si aún no hay GPS)
    // → paradas pendientes en orden → punto de finalización.
    try {
      const dest = (p.destino_lat && p.destino_lon)
        ? { lat: parseFloat(p.destino_lat), lng: parseFloat(p.destino_lon) } : null;
      const camion = lat !== null ? { lat, lng: lon } : null;
      actualizarRutaTracking(p.viaje_id, color, p.ruta_polyline, camion, grupos.filter(g => !g.hecha), dest);
    } catch (e) {
      console.error('[TR Tracking] Error dibujando la ruta del viaje', p.viaje_id, e);
    }

    // Punto de finalización elegido por el admin (banderita de llegada).
    try {
      if (p.destino_lat && p.destino_lon) {
        const dLat = parseFloat(p.destino_lat), dLon = parseFloat(p.destino_lon);
        const infoDestino = `<div style="color:#1a1a1a;font-size:13px"><strong>🏁 ${p.destino_nombre || 'Punto de finalización'}</strong><br><small>Fin del recorrido de ${p.patente}</small></div>`;
        if (trackingDestinoMarkers[p.viaje_id]) {
          trackingDestinoMarkers[p.viaje_id].marker.setPosition({ lat: dLat, lng: dLon });
        } else {
          const destinoMarker = new google.maps.Marker({
            position: { lat: dLat, lng: dLon }, map: trackingMapObj,
            icon: { path: google.maps.SymbolPath.CIRCLE, fillColor:'#6b7280', fillOpacity:1, strokeColor:'#fff', strokeWeight:2, scale:14 },
            label: { text: '🏁', fontSize: '12px' },
            title: p.destino_nombre || 'Punto de finalización',
          });
          trackingDestinoMarkers[p.viaje_id] = { marker: destinoMarker };
        }
      }
    } catch (e) {
      console.error('[TR Tracking] Error dibujando el destino del viaje', p.viaje_id, ':', e);
    }
  });

  // Quitar del mapa los viajes que ya no están activos.
  // Se comparan como STRING para evitar el bug de tipo: viaje_id llega
  // del servidor como "288" (string) y Number("288")===288 no coincide
  // con Set{"288"} — hacía que los marcadores se borraran al instante.
  const activos = new Set(r.positions.map(p => String(p.viaje_id)));
  Object.keys(trackingMarkers).forEach(vid => {
    if (!activos.has(vid)) { trackingMarkers[vid].marker.setMap(null); delete trackingMarkers[vid]; }
  });
  Object.keys(trackingDestinoMarkers).forEach(vid => {
    if (!activos.has(vid)) { trackingDestinoMarkers[vid].marker.setMap(null); delete trackingDestinoMarkers[vid]; }
  });
  Object.keys(trackingPolylines).forEach(vid => {
    if (!activos.has(vid)) quitarRutaTracking(vid);
  });
  // Quitar las paradas de viajes que ya no están activos o que cambiaron
  // de agrupación (solo sobreviven las dibujadas en este refresco).
  Object.keys(trackingParadaMarkers).forEach(k => {
    if (!trackingParadasVivas.has(k)) { trackingParadaMarkers[k].marker.setMap(null); delete trackingParadaMarkers[k]; }
  });
  if (!trackingYaEncuadrado) encuadrarTracking(r.positions);

  if (lista) {
    lista.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-top:4px">
    ${r.positions.map((p,i)=>{
      const color = colors[i%colors.length];
      const gruposTarjeta = agruparParadasTracking(p.paradas);
      const gpsTs = p.lat !== null
        ? `Actualizado: ${new Date(p.timestamp).toLocaleTimeString('es-AR')} · GPS vía ${p.fuente==='traccar'?'Traccar':'la web'}`
        : '📡 Sin señal GPS aún';
      return `
    <div class="card" style="padding:18px 20px">
      <div class="flex items-center gap-3 mb-3">
        <div style="width:44px;height:44px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🚛</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:16px">${p.patente||'Sin patente'}</div>
          <div class="text-sm text-muted">${p.repartidor}</div>
        </div>
        <span class="tag tag-azul" style="flex-shrink:0">En ruta</span>
      </div>
      <div style="display:flex;gap:16px;margin-bottom:10px">
        <div class="text-sm"><span class="text-muted">Zona:</span> <b>${p.zona||'-'}</b></div>
        <div class="text-sm"><span class="text-muted">Entregas:</span> <b>${gruposTarjeta.filter(g=>g.hecha).length} / ${gruposTarjeta.length}</b></div>
      </div>
      ${renderLineaParadas(gruposTarjeta)}
      <div class="text-sm text-muted" style="margin-top:8px">${gpsTs}</div>
    </div>`;
    }).join('')}
    </div>`;
  }
}

// Línea horizontal de progreso: un círculo por parada, en orden. Los ya
// entregados quedan marcados (verde con ✓); el tramo de línea entre dos
// entregados también se pinta de verde, mostrando el avance del reparto.
// Une las boletas de una misma dirección (coordenadas dentro de ~20 m) en
// UNA parada, igual que el mapa: así las tarjetas cuentan paradas y no
// boletas. Las que no tienen ubicación van al final, cada una aparte.
function agruparParadasTracking(paradas) {
  const TOL = 0.0002, grupos = [], sinCoords = [];
  (paradas || []).forEach(b => {
    if (!(b.lat && b.lon)) { sinCoords.push({ boletas: [b] }); return; }
    const lat = parseFloat(b.lat), lon = parseFloat(b.lon);
    const g = grupos.find(g => Math.abs(g.lat - lat) < TOL && Math.abs(g.lon - lon) < TOL);
    if (g) g.boletas.push(b); else grupos.push({ lat, lon, boletas: [b] });
  });
  const todos = [...grupos, ...sinCoords];
  todos.forEach(g => { g.hecha = g.boletas.every(b => b.estado === 'entregada'); });
  return todos;
}

function renderLineaParadas(grupos) {
  if (!grupos.length) return '';
  return `
  <div style="display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px">
    ${grupos.map((g,idx)=>{
      const hecho = g.hecha;
      // ¿el tramo de línea que llega a este círculo va pintado? (si el
      // anterior también está entregado)
      const prevHecho = idx>0 && grupos[idx-1].hecha;
      const linea = idx===0 ? '' :
        `<div style="flex:1;height:3px;margin-top:13px;min-width:14px;background:${prevHecho&&hecho?'var(--verde)':'var(--gris-cl,#3a3a3a)'}"></div>`;
      const horas = g.boletas.map(b => b.entregada_at).filter(Boolean).sort();
      const horaTxt = hecho && horas.length ? ' · ' + new Date(horas[horas.length-1]).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '';
      const circ = `
        <div style="display:flex;flex-direction:column;align-items:center;min-width:30px">
          <div title="${g.boletas.map(b => (b.cliente||'').replace(/"/g,'&quot;')).join(', ')}${horaTxt}"

  return `

  </div>

  </div>
  <div id="reportes-contenido"><div class="loading"><div class="spinner"></div> Cargando...</div></div>`;
}

async function loadReportes() {
  const hoy = fechaLocal();
  const hace7 = fechaLocal(new Date(Date.now()-7*86400000));
  document.getElementById('rep-desde').value = hace7;
  document.getElementById('rep-hasta').value = hoy;
  document.getElementById('rep-buscar-btn')?.addEventListener('click', buscarReportes);
  await buscarReportes();
}

async function buscarReportes() {
  const desde = document.getElementById('rep-desde').value;
  const hasta = document.getElementById('rep-hasta').value;
  const r = await api(`viajes.php?fecha=${desde}&hasta=${hasta}&reporte=1`);
  const el = document.getElementById('reportes-contenido');
  if (!el) return;

  // Stats globales
  const viajes = r.viajes || [];
  const finalizados = viajes.filter(v=>v.estado==='finalizado');
  const totalKm = finalizados.reduce((s,v)=>s+(v.km_estimado||0),0);
  const totalTiempo = finalizados.reduce((s,v)=>{
    if(!v.started_at||!v.finished_at) return s;
    return s+(new Date(v.finished_at)-new Date(v.started_at))/60000;
  },0);
  const combustible = totalKm * 0.10; // 10L/100km

  el.innerHTML = `
  <div class="stats-grid mb-4">
    <div class="stat-card"><div class="num">${finalizados.length}</div><div class="lbl">Viajes completados</div></div>
    <div class="stat-card"><div class="num">${totalKm.toFixed(0)} km</div><div class="lbl">Distancia total estimada</div></div>
    <div class="stat-card"><div class="num">${Math.round(totalTiempo/60)} hs</div><div class="lbl">Tiempo total en ruta</div></div>
    <div class="stat-card"><div class="num">${combustible.toFixed(0)} L</div><div class="lbl">Combustible estimado</div></div>
  </div>

  ${finalizados.length === 0 ? '<div class="card"><p class="text-muted">No hay viajes finalizados en ese período.</p></div>' : ''}

  <div style="display:grid;gap:16px">
  ${finalizados.map(v=>{
    const durMin = v.started_at && v.finished_at ? Math.round((new Date(v.finished_at)-new Date(v.started_at))/60000) : null;
    const km = v.km_estimado || 0;
    const comb = (km * 0.10).toFixed(1);
    const eficiencia = v.peso_total && v.km_estimado ? (v.peso_total / Math.max(km,1)).toFixed(1) : '-';
    return `
    <div class="card">
      <div class="flex items-center gap-3 mb-4" style="flex-wrap:wrap">
        <div><h3 style="font-size:18px;font-weight:700">🚛 ${v.patente||'Sin camión'}</h3>
        <div class="text-sm text-muted">${v.zona||'-'} · ${formatTime(v.fecha)}</div></div>
        <span class="tag tag-verde" style="margin-left:auto">✓ Finalizado</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
        <div><div class="text-sm text-muted">Repartidor</div><div style="font-weight:600">👤 ${v.repartidor_nombre||'-'}</div></div>
        <div><div class="text-sm text-muted">Paradas</div><div style="font-weight:600">📍 ${(v.boletas||[]).length}</div></div>
        <div><div class="text-sm text-muted">Peso</div><div style="font-weight:600">⚖️ ${v.peso_total} kg</div></div>
        <div><div class="text-sm text-muted">Distancia est.</div><div style="font-weight:600">🛣️ ${km.toFixed(1)} km</div></div>
        <div><div class="text-sm text-muted">Combustible est.</div><div style="font-weight:600">⛽ ${comb} L</div></div>
        <div><div class="text-sm text-muted">Duración</div><div style="font-weight:600">⏱ ${durMin ? durMin+'min' : '-'}</div></div>
        ${v.started_at?`<div><div class="text-sm text-muted">Salida</div><div style="font-weight:600">${formatTime(v.started_at)}</div></div>`:''}
        ${v.finished_at?`<div><div class="text-sm text-muted">Regreso</div><div style="font-weight:600">${formatTime(v.finished_at)}</div></div>`:''}
      </div>
    </div>`;
  }).join('')}
  </div>`;
}
